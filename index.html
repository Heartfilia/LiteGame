<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07070f" />
  <meta name="description" content="LiteGame 轻量游戏厅：打开即玩的网页小游戏合集，支持手机触屏与电脑键盘。" />
  <title>LiteGame 轻量游戏厅 · 网页小游戏合集</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="aurora-blob aurora-blob-a"></span>
    <span class="aurora-blob aurora-blob-b"></span>
    <span class="aurora-blob aurora-blob-c"></span>
    <span class="aurora-grid"></span>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="LiteGame 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#brandGradient)"/>
            <path d="M11 22V10.5l5 3.4 5-3.4V22" stroke="#0b0716" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="16" cy="23.4" r="1.6" fill="#0b0716"/>
            <defs>
              <linearGradient id="brandGradient" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
                <stop stop-color="#ff8ab0"/>
                <stop offset="0.55" stop-color="#ff5d8f"/>
                <stop offset="1" stop-color="#8a6bff"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="brand-text">Lite<em>Game</em></span>
      </a>

      <div class="search-wrap" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.4" stroke="currentColor" stroke-width="1.9"/>
          <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="search" placeholder="搜索游戏，比如「赛车」" autocomplete="off" spellcheck="false" aria-label="搜索游戏" />
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
        <div class="search-dropdown" id="searchDropdown" hidden></div>
      </div>

      <nav class="header-nav" aria-label="主导航">
        <a class="nav-link" href="#/">首页</a>
        <a class="nav-link" id="allCategoriesLink" href="#/">全部分区</a>
      </nav>
    </div>
  </header>

  <main id="app" class="app-shell"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="footer-dot"></span>
        LiteGame 轻量游戏厅
      </div>
      <p>打开即玩的网页小游戏，支持手机触屏与电脑键盘。</p>
      <p class="footer-meta">无需下载 · 无需登录 · 纯前端运行 · 部分游戏基于开源项目 <a class="footer-link" href="https://github.com/choganhq/chogan" target="_blank" rel="noopener">Chogan</a>（MIT）</p>
      <button class="footer-data" id="dataBtn" type="button" aria-haspopup="dialog" title="导入 / 导出游戏进度">
        <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <ellipse cx="12" cy="5.6" rx="7.4" ry="2.8" stroke="currentColor" stroke-width="1.7"/>
          <path d="M4.6 5.6v12.8c0 1.55 3.31 2.8 7.4 2.8s7.4-1.25 7.4-2.8V5.6" stroke="currentColor" stroke-width="1.7"/>
          <path d="M4.6 12c0 1.55 3.31 2.8 7.4 2.8s7.4-1.25 7.4-2.8" stroke="currentColor" stroke-width="1.7" opacity=".65"/>
        </svg>
        <span>进度备份</span>
      </button>
    </div>
  </footer>

  <div class="data-modal" id="dataModal" hidden role="dialog" aria-modal="true" aria-labelledby="dataModalTitle">
    <div class="data-backdrop" data-close></div>
    <div class="data-panel">
      <button class="data-close" type="button" aria-label="关闭" data-close>
        <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m6.4 6.4 11.2 11.2M17.6 6.4 6.4 17.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      </button>
      <span class="data-tag">BACKUP</span>
      <h2 id="dataModalTitle">游戏进度</h2>
      <p class="data-desc">所有游戏记录都保存在这台设备的浏览器里，包括最佳成绩、金币、成就和棋局进度。换设备或清理浏览器前，可以先导出成一个文件，之后随时导入恢复。</p>
      <div class="data-stats" id="dataStats"></div>
      <div class="data-actions">
        <button class="data-btn data-btn-primary" id="exportBtn" type="button">
          <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 15.4V4.2m0 0L7.8 8.4M12 4.2l4.2 4.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4.8 15.6v2.6a1.8 1.8 0 0 0 1.8 1.8h10.8a1.8 1.8 0 0 0 1.8-1.8v-2.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          </svg>
          导出进度
        </button>
        <button class="data-btn" id="importBtn" type="button">
          <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 4.2v11.2m0 0L7.8 11.2m4.2 4.2 4.2-4.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4.8 15.6v2.6a1.8 1.8 0 0 0 1.8 1.8h10.8a1.8 1.8 0 0 0 1.8-1.8v-2.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          </svg>
          导入进度
        </button>
        <input type="file" id="importFile" accept="application/json,.json" hidden />
      </div>
      <p class="data-msg" id="dataMsg" hidden></p>
      <div class="data-confirm" id="dataConfirm" hidden>
        <p id="dataConfirmText"></p>
        <div class="data-actions">
          <button class="data-btn data-btn-danger" id="importConfirmBtn" type="button">覆盖导入</button>
          <button class="data-btn" id="importCancelBtn" type="button">取消</button>
        </div>
      </div>
    </div>
  </div>

  <noscript>
    <div class="noscript">这个游戏厅需要启用 JavaScript 才能运行。</div>
  </noscript>

  <script src="assets/js/games.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>

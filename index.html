<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07070f" />
  <meta name="description" content="LiteGame 轻量游戏厅：打开即玩的网页小游戏合集，支持手机触屏与电脑键盘。" />
  <title>LiteGame 轻量游戏厅 · 网页小游戏合集</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="aurora-blob aurora-blob-a"></span>
    <span class="aurora-blob aurora-blob-b"></span>
    <span class="aurora-blob aurora-blob-c"></span>
    <span class="aurora-grid"></span>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="LiteGame 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#brandGradient)"/>
            <path d="M11 22V10.5l5 3.4 5-3.4V22" stroke="#0b0716" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="16" cy="23.4" r="1.6" fill="#0b0716"/>
            <defs>
              <linearGradient id="brandGradient" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
                <stop stop-color="#ff8ab0"/>
                <stop offset="0.55" stop-color="#ff5d8f"/>
                <stop offset="1" stop-color="#8a6bff"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="brand-text">Lite<em>Game</em></span>
      </a>

      <div class="search-wrap" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.4" stroke="currentColor" stroke-width="1.9"/>
          <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="search" placeholder="搜索游戏，比如「赛车」" autocomplete="off" spellcheck="false" aria-label="搜索游戏" />
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
        <div class="search-dropdown" id="searchDropdown" hidden></div>
      </div>

      <nav class="header-nav" aria-label="主导航">
        <a class="nav-link" href="#/">首页</a>
        <a class="nav-link" id="allCategoriesLink" href="#/">全部分区</a>
      </nav>
    </div>
  </header>

  <main id="app" class="app-shell"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="footer-dot"></span>
        LiteGame 轻量游戏厅
      </div>
      <p>打开即玩的网页小游戏，支持手机触屏与电脑键盘。</p>
      <p class="footer-meta">无需下载 · 无需登录 · 纯前端运行</p>
    </div>
  </footer>

  <noscript>
    <div class="noscript">这个游戏厅需要启用 JavaScript 才能运行。</div>
  </noscript>

  <script src="assets/js/games.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>

# LiteGame 轻量游戏厅 · Nginx 配置参考
# 实际位置：服务器 /etc/nginx/nginx.conf 内的 game.litetools.top 两个 server 块
# 生效命令：sudo nginx -t && sudo systemctl reload nginx
#
# 证书由 Certbot 签发（/etc/letsencrypt/live/game.litetools.top/），
# 续期走 80 端口的 /.well-known/acme-challenge/，已保留该路径。
# 站点文件由 deploy/deploy.sh 同步到 /opt/litegame，Nginx 配置不随代码部署自动改动。
# 本文件是 http {} 内的配置片段，不是完整 nginx.conf；部署步骤见 deploy/SECURITY.md。

# 必须放在 http {} 内、server {} 外。阈值预留游戏资源并发与同一出口多人访问。
# 使用 CDN 前先按 SECURITY.md 配置信任代理，否则这里限的是 CDN 出口 IP。
limit_req_zone $binary_remote_addr zone=litegame_requests:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=litegame_connections:10m;

# ---------- HTTP：跳转 HTTPS，保留证书续期路径 ----------
server {
    listen 80;
    listen [::]:80;
    server_name game.litetools.top;
    server_tokens off;
    if ($host != game.litetools.top) { return 444; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 20s;

    # Certbot 续期验证走这里（webroot 模式）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
        limit_req zone=litegame_requests burst=120 nodelay;
        limit_req_status 429;
    }

    location / {
        return 301 https://game.litetools.top$request_uri;
    }
}

# ---------- HTTPS：静态站点 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_tokens off;
    server_name game.litetools.top;

    root  /opt/litegame;
    index index.html;
    autoindex off;
    disable_symlinks on;
    if ($host != game.litetools.top) { return 444; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 20s;
    keepalive_requests 200;
    max_ranges 1;
    limit_req zone=litegame_requests burst=120 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;
    limit_conn litegame_connections 50;
    limit_conn_status 429;

    # 子 location 若定义 add_header，不会自动继承 server 层的其他头；
    # 下面带缓存策略的 location 会重复声明这些安全响应头。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 基础 CSP 不限制当前内联脚本、样式和 Blob Worker，避免破坏游戏。
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    access_log /var/log/nginx/litegame.access.log;
    error_log  /var/log/nginx/litegame.error.log;

    ssl_certificate     /etc/letsencrypt/live/game.litetools.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.litetools.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 优先拦截隐藏文件、部署/测试目录及常见秘密、备份、服务端脚本。
    location ~ /\. { return 404; }
    location ~* ^/(deploy|tests|node_modules)(/|$) { return 404; }
    location ~* (\.(env|ini|conf|log|sql|sqlite3?|db|bak|old|orig|swp|pem|key|p12|pfx|sh|cjs|php[0-9]?|phtml|phar|cgi|pl|py)(/|$)|~$) { return 404; }

    # 当前发布文件名没有内容 hash。所有会被替换的静态资源都必须每次
    # 向服务器重新验证，否则手机浏览器可能在刷新时继续使用旧文件。
    # 文件未改变时仍会走 304，不会重复传输完整内容。
    location ~* \.(jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    # no-cache 不是“不允许存储”，而是“使用前必须重新验证”。这比
    # max-age=1d 适合当前没有文件名 hash 的纯静态发布方式。
    location ~* \.(css|js|nes|json)$ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    # HTML 是资源入口和版本发现点，完全禁止缓存，避免手机强制刷新仍
    # 使用旧的文档／旧资源清单。安全响应头在此 location 中重复声明，
    # 因为 Nginx 子 location 一旦出现 add_header 就不会继承 server 层头。
    location ~* \.html$ {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        log_not_found off;
        try_files $uri =404;
    }

    # 首页使用 hash 路由，不需要将扫描的任意不存在路径伪装成 200 首页。
    location / {
        try_files $uri $uri/ =404;
    }
}

# LiteGame 轻量游戏厅 · Nginx 站点配置（纯静态站点，无后端进程）
# 放置位置：/etc/nginx/conf.d/litegame.conf
# 生效命令：sudo nginx -t && sudo systemctl reload nginx
#
# 使用顺序：
#   1. 先用这份配置，让域名能通过 HTTP 访问
#   2. 再运行：sudo certbot --nginx -d 你的域名
#      certbot 会自动改写本文件，补上 443 监听与 HTTPS 跳转，并自动续期

server {
    listen      80;
    listen      [::]:80;
    server_name litegame.example.com;

    access_log /var/log/nginx/litegame.access.log;
    error_log  /var/log/nginx/litegame.error.log;

    # 站点根目录，与 deploy.sh 中的 APP_DIR 保持一致
    root  /opt/litegame;
    index index.html;

    # 图片与字体是版本化更新的，允许浏览器与代理长时间缓存
    location ~* \.(jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # CSS / JS 更新相对频繁，协商缓存即可（文件带 hash 前可再调长）
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # 纯前端站点：任何路径都回落到 index.html，404 交给首页
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 游戏目录下的 html 直接按文件匹配，无需额外处理；
    # 这里只关掉不必要的日志，减少小文件 IO
    location ~* \.html$ {
        expires -1;
        log_not_found off;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

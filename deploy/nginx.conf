# LiteGame 轻量游戏厅 · Nginx 配置参考
# 实际位置：服务器 /etc/nginx/nginx.conf 内的 game.litetools.top 两个 server 块
# 生效命令：sudo nginx -t && sudo systemctl reload nginx
#
# 证书由 Certbot 签发（/etc/letsencrypt/live/game.litetools.top/），
# 续期走 80 端口的 /.well-known/acme-challenge/，已保留该路径。
# 站点文件由 deploy/deploy.sh 同步到 /opt/litegame，Nginx 配置不随代码部署自动改动。

# ---------- HTTP：跳转 HTTPS，保留证书续期路径 ----------
server {
    listen 80;
    listen [::]:80;
    server_name game.litetools.top;

    # Certbot 续期验证走这里（webroot 模式）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：静态站点 ----------
server {
    listen 443 ssl http2;
    server_tokens off;
    server_name game.litetools.top;

    root  /opt/litegame;
    index index.html;

    access_log /var/log/nginx/litegame.access.log;
    error_log  /var/log/nginx/litegame.error.log;

    ssl_certificate     /etc/letsencrypt/live/game.litetools.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.litetools.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 图片与字体是版本化更新的，允许浏览器与代理长时间缓存
    location ~* \.(jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # CSS / JS 更新相对频繁，协商缓存即可（文件带 hash 前可再调长）
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # 游戏目录下的 html 不缓存；关掉不必要的日志，减少小文件 IO
    location ~* \.html$ {
        expires -1;
        log_not_found off;
    }

    # 纯前端站点：任何路径都回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

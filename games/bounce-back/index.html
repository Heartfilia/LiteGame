<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bounce Back 回旋冒险 · LiteGame</title><link rel="icon" href="../../assets/images/covers/bounce-back.svg"><link rel="stylesheet" href="../lib/port.css"></head><body><main><header><a href="../../index.html#action">← 游戏厅</a><h1>Bounce Back · 回旋冒险</h1></header><div class="port-toolbar"><button id="port-start">开始 / 继续</button><button id="port-pause">暂停</button><button id="port-save">存档</button><button id="port-reset">重新开始</button></div><div class="port-stage port-stage--bounce"><canvas id="c1" aria-label="回旋镖冒险画面"></canvas></div><canvas id="c2"></canvas><div class="port-controls"><div class="port-pad"><button data-hold="87" aria-label="向上">▲</button><button data-hold="65" aria-label="向左">◀</button><button data-hold="83" aria-label="向下">▼</button><button data-hold="68" aria-label="向右">▶</button></div><div class="port-actions"><button data-hold="throw">投掷</button><button data-hold="32">冲刺</button><button id="port-retry">倒下后回营地</button></div></div><div id="port-status" role="status"></div><details><summary>玩法与存档说明</summary><p class="port-note">目标：穿过十层岛屿，击败最终首领。营地购买补给，向下走进入传送门。WASD 移动，鼠标瞄准，点击投掷，空格冲刺。手机用方向键移动，点画面瞄准并投掷；投掷按钮会瞄准附近敌人，没有敌人时朝当前方向投掷。冲刺期间可躲避伤害。<br>采用关卡检查点：进入下一层时保存装备、生命与金币，刷新会从本层入口重新挑战（地图重新生成），不会保留本层中途敌人与掉落。死亡后可回营地，金币保留。暂停、离开页面都会停止输入。</p></details><footer>原作 © 2019 Frank Force · <a href="https://github.com/js13kGames/bounce-back">源项目</a> · <a href="LICENSE">GPL-2.0-or-later</a> · <a href="SOURCE.md">本地源码与修改说明</a></footer></main><script src="../lib/campaign-save.js"></script><script src="../lib/port-shell.js"></script><script src="gameEngine.js"></script><script src="gameEngineDebug.js"></script><script src="game.js"></script><script src="adapter.js"></script></body></html>

<!doctype html><html lang="zh-CN"><head><script src="../../assets/js/server-sync.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>围住小猫 · LiteGame</title><link rel="icon" href="../../assets/images/covers/catchcat.svg"><link rel="stylesheet" href="../lib/port.css"><link rel="stylesheet" href="../lib/casual.css"></head><body><main class="casual-page"><header><a href="../../index.html#casual">← 游戏厅</a><h1>围住小猫</h1></header><div class="port-toolbar"><button id="port-start">开始 / 继续</button><button id="port-pause">暂停</button><button id="port-save">存档</button><button id="port-reset">重新开始</button></div><p id="casual-loading" role="status">正在加载… <a href="">重新载入</a></p><div id="casual-stats" class="casual-stats"></div><div class="casual-stage"><canvas id="casual-board" width="480" height="490" aria-label="围猫棋盘，点击空圆点设置障碍" tabindex="0"></canvas></div><div class="casual-actions"><button id="undo">撤销一步</button><button id="new-round">换一局</button><button id="casual-next" hidden>下一关</button><button id="casual-retry" hidden>重试本关</button></div><div id="casual-message" class="casual-message" role="status"></div><p id="casual-pause" class="port-note"></p><div id="port-status" role="status"></div><details><summary>玩法说明</summary><p class="casual-help">点击空圆点放置障碍，小猫随后沿最短逃生路线走一步。封住所有通往边缘的道路就赢；小猫走到边缘则失败。不是越贴近小猫越好，试着提前封路。<br>前四局提供较多初始障碍，之后逐渐减少，20 关完成挑战；随时可换一局或撤销。键盘方向键移动光标，回车封格。猫咪图形为本项目重绘，不加载 Phaser。每一步与关卡记录都可保存。</p></details><footer class="casual-credit">基于 Ganlv 的 phaser-catch-the-cat（MIT）寻路规则轻量移植，Canvas 图形重新绘制。<a href="SOURCE.md">源码与修改说明</a> · <a href="LICENSE">许可证</a></footer></main><script src="../lib/casual-loader.js" data-port="catchcat"></script></body></html>

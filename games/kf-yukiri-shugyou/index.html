        if (a.t > 2.4) { taisho.pose = state === 'play' ? 'hips' : taisho.pose; ladle.visible = false; if (!fats.length) delete E.abura; }
      }
      if (E.senpai) {
        const s = E.senpai; s.t += dt;
        senpai.root.position.x -= 1.5 * dt;
        s.stepT -= dt; if (s.stepT <= 0) { s.stepT = 0.36; sStep(); }
        if (!s.hit && senpai.root.position.x < Z.x + 0.18) { s.hit = true; jolt(-1.1, -0.5); sJolt(); shakeK = 0.6; }
        senpai.lookAt(camera.position);
        if (senpai.root.position.x < -1.9) { senpai.root.visible = false; delete E.senpai; }
      }
      if (E.cat) {
        const c = E.cat; c.t += dt;
        const up = clamp(c.t / 0.4, 0, 1) * clamp((3.0 - c.t) / 0.4, 0, 1);
        catPeek.position.set(-0.36, TABLE_Y - 0.15 + up * 0.25, 0.02);
        catPeek.quaternion.copy(camera.quaternion);
        const reach = clamp((c.t - 0.7) / 0.35, 0, 1) * clamp((2.6 - c.t) / 0.3, 0, 1);
        if (reach > 0) {
          if (!c.target) c.target = new THREE.Vector3(st.x + 0.02, st.y, st.z + 0.02);
          const base = new THREE.Vector3(-0.3, TABLE_Y + 0.04, 0.06);
          const tip = base.clone().lerp(c.target, reach * 1.05);
          tip.y += Math.sin(c.t * 18) * 0.012 * reach;
          catPaw.visible = catArm.visible = true; catPaw.position.copy(tip);
          const mid = base.clone().add(tip).multiplyScalar(0.5), len = base.distanceTo(tip);
          catArm.position.copy(mid); catArm.scale.set(1, Math.max(0.01, len), 1);
          catArm.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tip.clone().sub(base).normalize());
          if (!c.swat && reach > 0.9) { c.swat = true; burst(0.05, [[1500, 3, 1]], 0.25); }
        } else { catPaw.visible = catArm.visible = false; }
        if (c.t > 3.0) { catPeek.visible = catPaw.visible = catArm.visible = false; delete E.cat; }
      }
      if (E.dark) {
        const d = E.dark; d.t += dt;
        // 点滅させない（光の点滅は発作の原因になる）: ゆっくり暗くなって、ゆっくり戻る
        const fade = x => x * x * (3 - 2 * x);
        darkK = 0.93 * (d.t < 0.5 ? fade(d.t / 0.5) : d.t < 1.7 ? 1 : fade(clamp(1 - (d.t - 1.7) / 0.7, 0, 1)));
        if (d.t > 1.7 && !d.on) { d.on = true; sClick(); }
        if (d.t > 2.4) { darkK = 0; delete E.dark; }
      } else darkK = 0;
      // 大将が見張る
      const gz = state === 'play' && score >= 35 ? 1 : 0;
      gazeK += (gz - gazeK) * (1 - Math.exp(-dt * 1.5));
      if (gz) { E._beat = (E._beat ?? 0) - dt; if (E._beat <= 0) { E._beat = 0.85; sBeat(); } }
      // 粒の更新
      for (const p of steamPool) {
        if (p.life <= 0) continue;
        p.life -= dt; if (p.life <= 0) { p.s.visible = false; continue; }
        p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
        const k = 1 - p.life / p.max;
        p.vx *= 1 - dt * 0.8; p.vy *= 1 - dt * 0.4; p.vz *= 1 - dt * 0.8; // 上がりながら減速して広がる
        p.s.position.set(p.x, p.y, p.z); p.s.scale.setScalar(p.size * (0.5 + 1.5 * Math.sqrt(k)));

        // すっと現れて、ゆっくり消える
        p.s.material.opacity = p.op * Math.min(1, k / 0.15) * (1 - k) ** 1.5 * (1 - darkK * 0.7);
      }
      for (const d of dropData) { if (d.life <= 0) continue; d.life -= dt; d.vy -= G * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt; if (d.y < TABLE_Y) d.life = 0; }
      for (let i = fats.length - 1; i >= 0; i--) {
        const f = fats[i]; f.life -= dt; f.vy -= G * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;
        const dx = f.x - Z.x, dz = f.z - Z.z;
        if (f.vy < 0 && Math.hypot(dx, dz) < ZR && Math.abs(f.y - Z.y - ZC * (dx * dx + dz * dz)) < 0.02) {
          jolt(rnd(-0.45, 0.45), -rnd(0.3, 0.6)); sAbura();
          const m = new THREE.Mesh(fatG, fatM); m.scale.set(f.size, f.size * 0.6, f.size); m.position.set(dx, ZC * (dx * dx + dz * dz) + 0.003, dz); zaru.add(m); stuck.push(m);
          fats.splice(i, 1); continue;
        }
        if (f.life <= 0 || f.y < TABLE_Y) fats.splice(i, 1);
      }
    }

    // ---------- ゲームの1刻み ----------
    let lastSt = noodleStats();
    function step(dt) {
      clock += dt;
      physics(dt);
      const st = noodleStats(); lastSt = st;
      updateEvents(dt, st);
      if (state === 'play') {
        // 麺が浮いたら「投げた」、ざるに戻ったら1回
        if (!air && st.on === 0 && st.y - Z.y > 0.06) {
          air = true;
          const v = Math.max(0, st.vy);
          sToss(v); spray(Z.x, Z.y + 0.01, Z.z, Math.round(clamp(v * 12, 4, 20)), v * 0.8 + 0.3);
          // 毎回少し横に流れる（回数が増えるほど大きく）
          const dr = Math.min(0.32, 0.1 + score * 0.005) * STEP, ang = rnd(0, 6.28), ddx = Math.cos(ang) * dr, ddz = Math.sin(ang) * dr * 0.5;
          for (let i = 0; i < N; i++) { qx[i] -= ddx; qz[i] -= ddz; }
        }
        if (air && st.on > N * 0.2) {
          air = false; score++;
          sLand(1);
          scoreEl.textContent = t('count')(score); scoreEl.classList.remove('pop'); void scoreEl.offsetWidth; scoreEl.classList.add('pop');
        }
        if (st.lost > N * 0.3) fail();
      } else if (state === 'fail') {
        failT += dt;
        updateCutscene(dt);
        if (failT > 3.6) finish();
      }
      shakeK = Math.max(0, shakeK - dt * 1.5);
    }
    function fail() {
      state = 'fail'; failT = 0; drag = null;
      sSplat(); shakeK = 0.5;
      scoreEl.style.display = 'none';
      if (score > best) { best = score; store.set('best', best); newBest = true; }
      for (const k of Object.keys(ev)) if (k !== 'steam') delete ev[k];
      senpai.root.visible = false; catPeek.visible = catPaw.visible = catArm.visible = false; ladle.visible = false; fats.length = 0; darkK = 0;
      mouthPlan = [];
    }
    let cutStage = 0;
    function updateCutscene(dt) {
      if (failT < 0.55) { cutStage = 0; return; }
      if (cutStage === 0) {
        // カット: 大将のアップ
        cutStage = 1;
        taisho.root.position.set(0, 0, -0.62); taisho.root.rotation.y = 0; taisho.pose = 'point';
        zaru.visible = false; shakeK = 1;
        const first = pick([0, 1, 2, 3]);
        const d = yell(first);
        yell((first + 1 + Math.floor(Math.random() * 3)) % 4, d + 0.25);
        angerSprite.visible = true;
        burst(0.12, [[180, 1, 1]], 0.8); tone('sine', 90, 40, 0.3, 0.6); // ドン
      }
      const k = clamp((failT - 0.55) / 0.5, 0, 1);
      angryMats.forEach(a => a.m.color.copy(a.c).lerp(new THREE.Color('#ff2a2a'), 0.55 * k));
      if (Math.random() < dt * 14) { const hp = headPos(); steam(hp.x + rnd(-0.1, 0.1), hp.y + 0.12, hp.z + rnd(-0.05, 0.05), rnd(0.08, 0.14), 0.7, 0.8, rnd(-0.1, 0.1), 0.5, 0); }
    }
    const _hp = new THREE.Vector3();
    const headPos = () => { taisho.j.head.getWorldPosition(_hp); _hp.y += 0.09; return _hp; };
    function updateTaisho(dt, st) {
      if (state === 'fail' && cutStage === 1 || state === 'result') {
        taisho.face.brow = -1;
        let open = 0.15 + 0.05 * Math.sin(clock * 9);
        for (const [s, d, v] of mouthPlan) if (clock >= s && clock < s + d) open = v === 'i' ? 0.45 : v === 'u' || v === 'n' ? 0.4 : v === 'e' ? 0.75 : 1;
        taisho.face.open += (open - taisho.face.open) * (1 - Math.exp(-dt * 30));
        taisho.lookAt(camera.position);
        const talking = mouthPlan.some(([s, d]) => clock >= s && clock < s + d + 0.05);
        taisho.root.position.z = -0.62 + (talking ? 0.02 * Math.sin(clock * 30) : 0);
        const hp = headPos(); angerSprite.position.set(hp.x + 0.11, hp.y + 0.06, hp.z + 0.06);
        angerSprite.scale.setScalar(0.08 * (1 + 0.12 * Math.sin(clock * 6)));
      } else {
        taisho.face.open += (0 - taisho.face.open) * (1 - Math.exp(-dt * 10));
        taisho.face.brow = state === 'play' ? -0.4 - 0.5 * gazeK : -0.3;
        const tp = new THREE.Vector3(st.x, st.y, st.z);
        taisho.lookAt(tp);
        // 見張りモード: 近づいてくる
        const gp = new THREE.Vector3(0.3, 0, -0.62);
        const tgt = TAISHO_HOME.clone().lerp(gp, gazeK);
        taisho.root.position.lerp(tgt, 1 - Math.exp(-dt * 3));
        taisho.root.rotation.y = -0.35 + 0.15 * gazeK;
      }
      taisho.update(dt);
      if (senpai.root.visible) senpai.update(dt);
    }

    // ---------- 画面サイズとカメラ ----------
    const layout = { w: 1, h: 1, H: 1, fh: 1, band: 0, wpp: 0.002, reserve: 160 };
    function resize() {
      const w = stage.clientWidth, H = stage.clientHeight;
      renderer.setSize(w, H, false);
      const btnH = Math.min(72, Math.max(56, 0.08 * Math.min(innerWidth, innerHeight))) + 12;
      const reserve = Math.max(0, stage.getBoundingClientRect().bottom - controls.getBoundingClientRect().bottom) + btnH;
      stage.style.setProperty('--reserve', reserve + 'px');
      const h = Math.max(140, H - reserve);
      Object.assign(layout, { w, h, H, reserve });
    }
    const PLAY_C = new THREE.Vector3(0, 1.34, 0), PLAY_DIR = new THREE.Vector3(0, 0.36, 1).normalize();
    const _aim = new THREE.Vector3(), _cp = new THREE.Vector3();
    function placeCamera() {
      const { w, h, H } = layout;
      const cut = state === 'result' || (state === 'fail' && cutStage === 1);
      // 大事な範囲（半分の幅・高さ）
      const res = state === 'result';
      const hw = cut ? (res ? 0.27 : 0.21) : 0.46, hh = cut ? (res ? 0.42 : 0.3) : 0.52;
      let fh = h, band = 0;
      const want = hw / hh;
      if (w / h < want) { fh = clamp(w / want * 1.12, h * 0.55, h); band = h - fh; }
      if (cut) { fh = h; band = 0; }
      // 背の低い横長の結果画面は、文字を左に出すので大将を右へずらす
      const wideLow = state === 'result' && h <= 520 && w / h >= 4 / 3;
      camera.aspect = w / fh;
      camera.setViewOffset(w, fh, wideLow ? -Math.round(w * 0.17) : 0, -band, w, H);
      const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
      const d = Math.min(Math.max(hw / Math.tan(hf / 2), hh / Math.tan(vf / 2)), 3.2);
      layout.wpp = 2 * d * Math.tan(vf / 2) / fh;
      if (!cut) {
        camera.position.copy(PLAY_C).addScaledVector(PLAY_DIR, d);
        camera.lookAt(PLAY_C);
      } else {
        const hp = headPos();
        _aim.set(hp.x, hp.y - 0.12, hp.z);
        if (state === 'result') _aim.y -= 0.1;
        const zoom = state === 'fail' ? 1 + 0.25 * Math.exp(-(failT - 0.55) * 8) : 1;
        _cp.set(_aim.x, _aim.y - 0.06, _aim.z + d * zoom);
        camera.position.copy(_cp);
        camera.lookAt(_aim);
      }
      if (shakeK > 0) { camera.position.x += (Math.random() - 0.5) * 0.03 * shakeK; camera.position.y += (Math.random() - 0.5) * 0.03 * shakeK; }
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld();
    }

    // ---------- 画面 ----------
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', start);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(score))}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = t('share')(score);
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'yukiri-shugyou.png'; d.click(); }
      });
      controls.append(a);
    }
    // 結果画像: キレる大将の顔に回数を重ねる
    let snap = null, shareCache = null, needSnap = false;
    function takeSnap() {
      const src = renderer.domElement;
      const focus = headPos().clone(); focus.y -= 0.05; focus.project(camera);
      const fx = (focus.x + 1) / 2 * src.width, fy = (1 - focus.y) / 2 * src.height;
      const side = Math.min(src.width, src.height);
      const sx = clamp(fx - side / 2, 0, src.width - side), sy = clamp(fy - side * 0.4, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      const gr = g.createLinearGradient(0, 700, 0, 1080); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.45)'); g.fillStyle = gr; g.fillRect(0, 700, 1080, 380);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#7a2a10'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('count')(score), 960, 180, 960);
      text(t('title'), 90, 56, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'yukiri-shugyou.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function showResult() {
      resultEl.children[0].textContent = t('count')(score);
      resultEl.children[1].textContent = t('best')(best);
    }
    function start() { reset(); resize(); }
    function finish() {
      if (state !== 'fail') return;
      if (cutStage === 0) updateCutscene(0.6);
      state = 'result';
      showResult();
      resultEl.style.display = 'flex';
      snap = null; needSnap = true;
      renderControls(); resize();
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0, lastHint = '';
    const _lp = new THREE.Vector3();
    function render(al, dt) {
      // ざる（補間）
      zaru.position.set(Z.prx + (Z.x - Z.prx) * al, Z.pry + (Z.y - Z.pry) * al, Z.z);
      zaru.rotation.z = clamp(-Z.vx * 0.04, -0.12, 0.12) * 0; // 傾けない（当たり判定と合わせる）
      drawNoodles(al);
      updateTaisho(dt, lastSt);
      for (const f of fans) f.rot.rotation.z += 0.6 * dt * f.side;
      // しぶき・背脂
      let n = 0;
      for (const d of dropData) { if (d.life <= 0) continue; _m.compose(_p.set(d.x, d.y, d.z), _q, _s.setScalar(d.size)); drops.setMatrixAt(n++, _m); }
      drops.count = n; drops.instanceMatrix.needsUpdate = true;
      n = 0;
      for (const f of fats) { _m.compose(_p.set(f.x, f.y, f.z), _q, _s.set(f.size, f.size * 0.7, f.size)); fatFly.setMatrixAt(n++, _m); }
      fatFly.count = n; fatFly.instanceMatrix.needsUpdate = true;
      // 明るさ（停電）
      hemi.intensity = LIGHTS.hemi * (1 - darkK * 0.92); sun.intensity = LIGHTS.sun * (1 - darkK);
      // 画面の重ね物（値が変わった時だけ書く）
      const gz = (gazeK * 0.9).toFixed(2); if (gazeEl.style.opacity !== gz) gazeEl.style.opacity = gz;
      // 赤は点滅させず、じわっと濃くして止める
      const fl = state === 'fail' && cutStage === 1 ? (0.45 * clamp((failT - 0.55) / 0.6, 0, 1)).toFixed(2) : state === 'result' ? '0.25' : '0';
      if (flashEl.style.opacity !== fl) flashEl.style.opacity = fl;
      placeCamera();
      // 最初の操作の案内（ざるの横）
      let hint = 'none';
      if (state === 'ready') {
        _lp.set(Z.x - 0.25, Z.y + 0.04, Z.z).project(camera);
        const x = (_lp.x + 1) / 2 * layout.w, y = (1 - _lp.y) / 2 * layout.H;
        hintEl.style.left = x.toFixed(0) + 'px'; hintEl.style.top = y.toFixed(0) + 'px'; hint = 'block';
      }
      if (hint !== lastHint) { hintEl.style.display = hint; lastHint = hint; }
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(acc / STEP, dt);
      requestAnimationFrame(loop);
    }

    addEventListener('resize', resize);
    resize();
    reset();
    if (window.__KF_ZH__) lang = 'zh';
    applyLang();
    // 最初の1回が重くならないように、全部の形を一度描いておく
    {
      senpai.root.visible = catPeek.visible = catPaw.visible = catArm.visible = ladle.visible = angerSprite.visible = true;
      placeCamera(); renderer.compile(scene, camera); render(1, 0.016);
      senpai.root.visible = catPeek.visible = catPaw.visible = catArm.visible = ladle.visible = angerSprite.visible = false;
    }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>

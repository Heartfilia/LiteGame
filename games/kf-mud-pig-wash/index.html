    pos.push(x0 + (i + sx / n) * h, y0 + (j + sy / n) * h, z0 + (k + sz / n) * h);
  }
  // 辺ごとに四角形
  const idx = [];
  const P = pos;
  const quad = (a, b, c, d, ax, ay, az) => {
    if (a < 0 || b < 0 || c < 0 || d < 0) return;
    // 法線の向きを、辺の向き（中→外）に合わせる
    const ux = P[b * 3] - P[a * 3], uy = P[b * 3 + 1] - P[a * 3 + 1], uz = P[b * 3 + 2] - P[a * 3 + 2];
    const vx = P[c * 3] - P[a * 3], vy = P[c * 3 + 1] - P[a * 3 + 1], vz = P[c * 3 + 2] - P[a * 3 + 2];
    const nx_ = uy * vz - uz * vy, ny_ = uz * vx - ux * vz, nz_ = ux * vy - uy * vx;
    if (nx_ * ax + ny_ * ay + nz_ * az < 0) idx.push(a, d, c, a, c, b); else idx.push(a, b, c, a, c, d);
  };
  for (let k = 0; k < nz; k++) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const v0 = F[id(i, j, k)];
    if (i < nx - 1 && j > 0 && k > 0 && j < ny - 1 && k < nz - 1) {
      const v1 = F[id(i + 1, j, k)];
      if ((v0 < 0) !== (v1 < 0)) { const s = v0 < 0 ? 1 : -1; quad(cellIdx[cidx(i, j - 1, k - 1)], cellIdx[cidx(i, j, k - 1)], cellIdx[cidx(i, j, k)], cellIdx[cidx(i, j - 1, k)], s, 0, 0); }
    }
    if (j < ny - 1 && i > 0 && k > 0 && i < nx - 1 && k < nz - 1) {
      const v1 = F[id(i, j + 1, k)];
      if ((v0 < 0) !== (v1 < 0)) { const s = v0 < 0 ? 1 : -1; quad(cellIdx[cidx(i - 1, j, k - 1)], cellIdx[cidx(i, j, k - 1)], cellIdx[cidx(i, j, k)], cellIdx[cidx(i - 1, j, k)], 0, s, 0); }
    }
    if (k < nz - 1 && i > 0 && j > 0 && i < nx - 1 && j < ny - 1) {
      const v1 = F[id(i, j, k + 1)];
      if ((v0 < 0) !== (v1 < 0)) { const s = v0 < 0 ? 1 : -1; quad(cellIdx[cidx(i - 1, j - 1, k)], cellIdx[cidx(i, j - 1, k)], cellIdx[cidx(i, j, k)], cellIdx[cidx(i - 1, j, k)], 0, 0, s); }
    }
  }
  // 頂点を表面にぴったり寄せて、法線は距離関数の傾きから
  const nv = pos.length / 3, position = new Float32Array(pos), normal = new Float32Array(nv * 3), g = [0, 0, 0];
  for (let v = 0; v < nv; v++) {
    let x = position[v * 3], y = position[v * 3 + 1], z = position[v * 3 + 2];
    for (let it = 0; it < 2; it++) { const f = sdf(x, y, z); pigGrad(x, y, z, g, h * 0.5); x -= g[0] * f; y -= g[1] * f; z -= g[2] * f; }
    position[v * 3] = x; position[v * 3 + 1] = y; position[v * 3 + 2] = z;
    pigGrad(x, y, z, g, 0.004);
    normal[v * 3] = g[0]; normal[v * 3 + 1] = g[1]; normal[v * 3 + 2] = g[2];
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(position, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(normal, 3));
  geo.setIndex(nv > 65535 ? new THREE.Uint32BufferAttribute(idx, 1) : new THREE.Uint16BufferAttribute(idx, 1));
  return geo;
}

// ===== GLSL のノイズ（泥の模様・ひび割れ・肌の毛穴） =====
const GLSL_NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

// ===== 豚の肌＋泥の材質 =====
// 頂点ごとに 泥の量 aMud（0=きれい、1以上=厚い泥）・濡れ aWet・くぼみの暗さ aAO を持たせ、
// シェーダーで、ノイズでギザギザにした泥のふち・乾いた泥のひび・濡れたつや・肌の色むらを描く。
// uDent: 水が当たってへこむ所（体の座標 xyz、深さ w）。uJig: お腹のお肉の揺れ。uSunV: 光の向き（カメラから見た向き）
const pigU = { uLegs: { value: new THREE.Vector4() }, uYaw: { value: 0 }, uPitch: { value: 0 }, uClean: { value: 0 },
  uDent: { value: new THREE.Vector4(0, -9, 0, 0) }, uWob: { value: 0 }, uJig: { value: 0 }, uTime: { value: 0 }, uSunV: { value: new THREE.Vector3(0, 1, 0) } };
function makeSkinMat(kind) {
  const m = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.55, sheen: 1, sheenColor: new THREE.Color('#ffe9df'), sheenRoughness: 0.45, clearcoat: 1, clearcoatRoughness: 0.12, envMapIntensity: 0.9 });
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, pigU, {
      uSkin: { value: new THREE.Color('#f2b9aa') }, uSkin2: { value: new THREE.Color('#e88f86') },
      uMudWet: { value: new THREE.Color('#22170f') }, uMudDry: { value: new THREE.Color('#8c7155') }, uMudMid: { value: new THREE.Color('#4d3826') },
      uRed: { value: kind === 'ear' ? 0.75 : kind === 'tail' ? 0.45 : 0 }, uThin: { value: kind === 'ear' ? 1 : kind === 'tail' ? 0.5 : 0.12 },
    });
    if (kind === 'body') sh.defines = { ...(sh.defines || {}), PIG_SKIN: '' };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        attribute float aMud; attribute float aWet; attribute float aAO; attribute vec4 aN;
        varying float vMud; varying float vWet; varying float vAO; varying vec3 vLP; varying vec4 vN;
        uniform float uClean; uniform vec4 uDent; uniform float uWob; uniform float uJig; uniform float uTime;
        #ifdef PIG_SKIN
        attribute vec3 aSkin; attribute float aSoft; uniform vec4 uLegs; uniform float uYaw; uniform float uPitch;
        #endif`)
      .replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>
        vec3 dPiv = vec3(0.0); mat3 dR = mat3(1.0);
        #ifdef PIG_SKIN
        if (aSkin.x > 0.5) {
          int li = int(aSkin.x + 0.5) - 1;
          float ang = (li == 0 ? uLegs.x : li == 1 ? uLegs.y : li == 2 ? uLegs.z : uLegs.w) * aSkin.y;
          float c = cos(ang), s = sin(ang);
          dR = mat3(c, s, 0.0, -s, c, 0.0, 0.0, 0.0, 1.0);
          dPiv = vec3(li < 2 ? ${LEG.fx.toFixed(3)} : ${(LEG.hx + 0.01).toFixed(3)}, ${LEG.hipY.toFixed(3)}, 0.0);
        } else if (aSkin.z > 0.0) {
          float yw = uYaw * aSkin.z, pt = uPitch * aSkin.z;
          float cy = cos(yw), sy = sin(yw), cp = cos(pt), sp = sin(pt);
          dR = mat3(cy, 0.0, -sy, 0.0, 1.0, 0.0, sy, 0.0, cy) * mat3(cp, sp, 0.0, -sp, cp, 0.0, 0.0, 0.0, 1.0);
          dPiv = vec3(0.48, 0.5, 0.0);
        }
        #endif
        float softD = 0.0;
        #ifdef PIG_SKIN
        {
          // 水圧でへこむ（ふちは波打つ）。へこみの坂に合わせて法線も傾ける
          vec3 dp = position - uDent.xyz; float d2 = dot(dp, dp), dd = sqrt(d2);
          const float RR = 0.085;
          float fall = exp(-d2 / (RR * RR));
          float A = 0.024 * uDent.w;
          // 押されたお肉がまわりに盛り上がる輪
          const float RC = 0.12, RWD = 0.045;
          float ring = exp(-(dd - RC) * (dd - RC) / (RWD * RWD));
          float B = 0.3 * A;
          float wob = uWob * sin(dd * 120.0 - uTime * 32.0) * exp(-dd / 0.06) * smoothstep(0.0, 0.02, dd);
          // お腹とわき腹のお肉がぷるぷる揺れる
          float belly = smoothstep(0.6, 0.28, position.y) * smoothstep(-0.6, -0.25, position.x) * smoothstep(0.5, 0.22, position.x);
          float jig = uJig * belly * (0.6 + 0.4 * sin(position.x * 9.0 + position.z * 4.0));
          softD = (-A * fall + B * ring + 0.0018 * wob + 0.009 * jig) * aSoft;
          vec3 g = ((2.0 * A * fall / (RR * RR)) * dp - (B * ring * 2.0 * (dd - RC) / (RWD * RWD)) * dp / max(dd, 1e-4)) * aSoft;
          g -= objectNormal * dot(g, objectNormal);
          objectNormal = normalize(objectNormal - g);
        }
        #endif
        objectNormal = dR * objectNormal;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        transformed += normal * softD;
        transformed = dPiv + dR * (transformed - dPiv);
        float mudN = aN.w; vN = aN;
        float mm = aMud * (1.0 - uClean);
        transformed += objectNormal * (0.0042 * clamp(mm, 0.0, 1.6) * (0.65 + 0.45 * mudN));
        vMud = mm; vWet = aWet; vAO = aAO; vLP = position;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying float vMud; varying float vWet; varying float vAO; varying vec3 vLP; varying vec4 vN;
        uniform vec3 uSunV; uniform float uThin;
        uniform vec3 uSkin; uniform vec3 uSkin2; uniform vec3 uMudWet; uniform vec3 uMudDry; uniform vec3 uMudMid; uniform float uRed;
        float gCover; float gN1; float gN2; float gHeight; float gWetMud; float gSnout;
        ${GLSL_NOISE}
        vec3 bumpN(vec3 surf_pos, vec3 surf_norm, float hh, float scale) {
          vec3 sx = dFdx(surf_pos), sy = dFdy(surf_pos);
          vec3 R1 = cross(sy, surf_norm), R2 = cross(surf_norm, sx);
          float det = dot(sx, R1);
          vec2 dh = vec2(dFdx(hh), dFdy(hh)) * scale;
          vec3 grad = sign(det) * (dh.x * R1 + dh.y * R2);
          return normalize(abs(det) * surf_norm - grad);
        }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        {
          vec3 P = vLP;
          float n1 = vN.x;
          float n2 = snoise(P * 120.0);
          gN1 = n1; gN2 = n2;
          // 泥のふち: 量のしきい値をノイズで揺らして、ギザギザの島にする
          float thr = 0.2 + 0.13 * n1 + 0.06 * n2;
          float cover = smoothstep(thr - 0.035, thr + 0.035, vMud);
          gCover = cover;
          float stain = smoothstep(0.0, 0.3, vMud) * (1.0 - cover);
          // 肌: ピンクに色むら、鼻と耳は赤め、うっすら白い産毛
          float red = clamp(uRed + smoothstep(0.84, 0.92, P.x) * 0.8, 0.0, 1.0);
          vec3 skin = mix(uSkin, uSkin2, clamp(red * 0.8 + 0.25 * vN.y + 0.1, 0.0, 1.0));
          skin *= 0.96 + 0.04 * n2;
          skin = mix(skin, skin * vec3(0.82, 0.74, 0.7), smoothstep(0.55, 0.75, vN.z) * 0.35);
          skin = mix(skin, skin * vec3(0.93, 0.85, 0.83), vWet * 0.6);
          // しわ: 首のまわりと鼻すじ
          float neck = smoothstep(0.4, 0.47, P.x) * smoothstep(0.62, 0.53, P.x) * smoothstep(0.58, 0.42, P.y);
          float wr = neck * sin(P.x * 150.0 + vN.z * 2.5);
          float snW = smoothstep(0.8, 0.86, P.x) * smoothstep(0.95, 0.9, P.x) * smoothstep(0.46, 0.5, P.y) * sin(P.x * 240.0 + vN.y * 1.5);
          skin *= 1.0 - 0.1 * max(-wr, 0.0) - 0.06 * max(-snW, 0.0);
          // 鼻の平らな面: 少し濃いピンクでしっとり。鼻の穴は奥が暗い
          gSnout = smoothstep(0.948, 0.958, P.x);
          skin = mix(skin, uSkin2 * vec3(0.95, 0.82, 0.82), gSnout * 0.6);
          vec2 nq = vec2((P.y - 0.448) / 0.019, (abs(P.z) - 0.026) / 0.011);
          float nost = (1.0 - smoothstep(0.55, 1.05, length(nq))) * smoothstep(0.94, 0.955, P.x);
          skin = mix(skin, vec3(0.16, 0.06, 0.05), nost * 0.9);
          skin = mix(skin, uMudDry * 1.1, stain * 0.55);
          // 泥: 厚い所と濡れた所は黒っぽく、乾いた所は白っぽい土色。ひび割れは暗い線
          float thick = smoothstep(0.6, 1.5, vMud);
          float wetMud = clamp(vWet * 0.9 + thick * 0.35 + 0.2 * n1, 0.0, 1.0);
          gWetMud = wetMud;
          vec3 mud = mix(uMudDry, uMudMid, clamp(0.5 + 0.7 * n1, 0.0, 1.0));
          mud = mix(mud, uMudWet, wetMud);
          
          mud *= 0.9 + 0.2 * (0.5 + 0.5 * n2);
          diffuseColor.rgb = mix(skin, mud, cover);
          diffuseColor.rgb *= mix(1.0, vAO, 0.55);
          gHeight = cover * (0.55 + 0.6 * n1 + 0.12 * n2 + 0.5 * thick) + (1.0 - cover) * (0.06 * snoise(P * 260.0) + 0.35 * wr + 0.25 * snW);
        }`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(mix(mix(0.58, 0.3, vWet), 0.22, gSnout), mix(0.97, 0.2, gWetMud), gCover);`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        normal = bumpN(-vViewPosition, normal, gHeight, 0.0032);`)
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
        {
          // 皮膚の下で光が回り込む赤み（光の当たる境目）と、薄い所（耳）が後ろから透ける光
          float ndl = dot(normal, uSunV);
          float wrap = max(0.0, (ndl + 0.6) / 1.6) - max(0.0, ndl);
          vec3 V = normalize(vViewPosition);
          float back = pow(max(dot(V, -uSunV), 0.0), 3.0);
          float skinAmt = (1.0 - gCover);
          vec3 sss = vec3(1.0, 0.32, 0.22);
          reflectedLight.directDiffuse += diffuseColor.rgb * sss * (wrap * 0.9 + back * uThin * 1.6) * skinAmt * vAO;
          reflectedLight.indirectDiffuse += diffuseColor.rgb * sss * 0.06 * skinAmt;
        }`)
      .replace('#include <aomap_fragment>', `#include <aomap_fragment>
        reflectedLight.indirectDiffuse *= vAO; reflectedLight.indirectSpecular *= vAO;`)
      .replace('#include <lights_physical_fragment>', `#include <lights_physical_fragment>
        #ifdef USE_CLEARCOAT
        material.clearcoat = clamp(vWet * (1.0 - gCover) * 0.5 + smoothstep(0.4, 0.9, gWetMud) * gCover * 0.8, 0.0, 1.0);
        #endif
        #ifdef USE_SHEEN
        material.sheenColor *= (1.0 - gCover) * (1.0 - vWet * 0.6) * 0.55;
        #endif`);
  };
  m.customProgramCacheKey = () => 'pig-' + kind;
  return m;
}

// ===== 豚を組み立てる =====
const pig = new THREE.Group();       // 位置と向き
const body = new THREE.Group();      // ブルブル震える所（胴の高さで回す）
body.position.y = 0.45;
pig.add(body);
const inner = new THREE.Group(); inner.position.y = -0.45; body.add(inner);
scene.add(pig);

const t0 = performance.now();
const bodyGeo = buildSurface(pigSDF, -0.66, 0.02, -0.31, 1.0, 0.76, 0.31, 0.0105);
const buildMs = performance.now() - t0;
// 脚と頭の動きの重み
{
  const p = bodyGeo.attributes.position, n = p.count, skin = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const front = x > 0, lx = front ? LEG.fx : LEG.hx, az = Math.abs(z);
    const dxz = Math.hypot(x - lx, az - LEG.z);
    const w = sstep(LEG.hipY + 0.02, 0.24, y) * sstep(0.2, 0.1, dxz);
    if (w > 0.001) { skin[i * 3] = (front ? 1 : 3) + (z < 0 ? 1 : 0); skin[i * 3 + 1] = w; }
    else skin[i * 3 + 2] = sstep(0.42, 0.62, x);
  }
  bodyGeo.setAttribute('aSkin', new THREE.BufferAttribute(skin, 3));
  // 柔らかさ（骨に近い所は硬い）: お腹・わき腹・ほおは柔らかく、脚・背骨・肩甲骨・腰の骨・頭蓋骨は硬い
  const soft = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), az = Math.abs(z);
    const lx = x > 0 ? LEG.fx : LEG.hx, dxz = Math.hypot(x - lx, az - LEG.z);
    let sf = 1;
    sf = lerp(sf, 0.06, sstep(0.36, 0.24, y) * sstep(0.14, 0.07, dxz));            // 脚
    sf *= 1 - 0.6 * sstep(0.62, 0.7, y) * sstep(0.1, 0.02, az);                      // 背骨
    sf *= 1 - 0.45 * Math.exp(-((x - 0.3) ** 2) / 0.01 - ((y - 0.56) ** 2) / 0.012); // 肩甲骨
    sf *= 1 - 0.4 * Math.exp(-((x + 0.36) ** 2) / 0.008 - ((y - 0.62) ** 2) / 0.006); // 腰の骨
    if (x > 0.5) {
      sf = lerp(sf, 0.1, sstep(0.52, 0.62, x) * sstep(0.46, 0.55, y));               // 頭蓋骨（額・頭の上）
      sf = lerp(sf, 0.3, sstep(0.8, 0.88, x));                                         // 鼻（軟骨）
    }
    soft[i] = clamp(sf, 0.04, 1);
  }
  bodyGeo.setAttribute('aSoft', new THREE.BufferAttribute(soft, 1));
}
// くぼみ（脚の付け根・お腹の下・目のまわり）を暗くする: 法線の先の距離を何回か測る
function bakeAO(geo, extraSDF) {
  const p = geo.attributes.position, nrm = geo.attributes.normal, n = p.count, ao = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), nx = nrm.getX(i), ny = nrm.getY(i), nz = nrm.getZ(i);
    let occ = 0, w = 1;
    for (let s = 1; s <= 5; s++) {
      const hh = 0.018 * s;
      const qx = x + nx * hh, qy = y + ny * hh, qz = z + nz * hh;
      const d = Math.min(pigSDF(qx, qy, qz), qy + 0.01, extraSDF ? extraSDF(qx, qy, qz) : 1);
      occ += (hh - d) * w; w *= 0.6;
    }
    ao[i] = clamp(1 - occ * 7.5, 0.25, 1);
  }
  geo.setAttribute('aAO', new THREE.BufferAttribute(ao, 1));
}
bakeAO(bodyGeo);
const washables = []; // 泥が付く部品 { mesh, mud, wet, rest(体の座標), area(重み) }
function addWashable(mesh, geo) {
  const n = geo.attributes.position.count;
  const mud = new Float32Array(n), wet = new Float32Array(n);
  geo.setAttribute('aMud', new THREE.BufferAttribute(mud, 1).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('aWet', new THREE.BufferAttribute(wet, 1).setUsage(THREE.DynamicDrawUsage));

// 「ありがとう」: 吹き出しを出して、合成した声でしゃべる

function prepareShare() {

// ===== 毎フレーム =====
const DT = 1 / 60;
let last = performance.now(), acc = 0, frameN = 0, frameEma = 16, slowT = 0;
const hintEl = $('hint'), hint2El = $('hint2');
let hint2On = false;

const _bb = new THREE.Box3();
function placeHint2() {

const _al = new THREE.Vector3();

function step(dt) {

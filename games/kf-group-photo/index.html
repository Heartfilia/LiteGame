    // ---------- 画面サイズ ----------

    // ---------- 目の動き ----------
    const ease = x => x * x * (3 - 2 * x);
    function stepEyes(p, dt, fat) {

      // まばたき: 閉じる 0.06秒・閉じたまま 0.04秒・開く 0.11秒 くらい

      if (p.bt >= 0) {

    // ---------- 雑談 ----------

    let gameT = 0, chatNext = 0.3;

    function talkState(p) {

    function speak(sp, li) {

      for (let i = 0; i < n; i++) {

          for (const s of [-1, 1]) { const mm = s < 0 ? m : new THREE.Mesh(SPH, m.material); mm.position.copy(tmpV).add(new THREE.Vector3(0, -0.3, s * 1.5)); mm.scale.setScalar(0.35); mm.userData.t = 0; scene.add(mm); trail.push(mm); }
        }
        if (planeT * 7 > 190) { planeT = -rnd(14, 24); planeDir = Math.random() < 0.5 ? 1 : -1; planeNy = rnd(0.62, 0.85); planeZ = rnd(-70, -50); plane.visible = false; }
      } else plane.visible = false;
      for (let i = trail.length - 1; i >= 0; i--) {
        const m = trail[i]; m.userData.t += dt;
        const q = m.userData.t / 7;
        m.scale.setScalar(0.35 + q * 1.6); m.material.opacity = 0.65 * (1 - q);
        if (q >= 1) { scene.remove(m); m.material.dispose(); trail.splice(i, 1); }
      }
      // 鳥: 羽ばたきながら群れで横切る
      flockT -= dt;
      if (flockT <= 0) {
        flockX += flockDir * dt * 5;
        if (Math.abs(flockX) > 45) { flockT = rnd(8, 16); flockDir = Math.random() < 0.5 ? 1 : -1; flockX = -flockDir * 45; flockNy = rnd(0.35, 0.6); flockZ = rnd(-28, -16); }
        if (state === 'play' && Math.random() < dt * 0.6 && Math.abs(flockX) < 25) sChirp(); // 結果の時は鳴かない
      }
      for (const b of birds) {
        const u = b.userData;
        b.visible = flockT <= 0;
        b.position.set(flockX + u.off.x * flockDir, skyY(flockZ, flockNy) + u.off.y + Math.sin(now * 2 + u.ph) * 0.2, flockZ + u.off.z);
        b.rotation.y = flockDir > 0 ? 0 : Math.PI;
        const f = Math.sin(now * 12 + u.ph) * 0.7;
        u.w[0].rotation.x = f; u.w[1].rotation.x = -f;
      }
      // 蝶々
      for (const b of butterflies) {
        const u = b.userData; u.t += dt;
        if (u.on) {
          u.on.head.updateWorldMatrix(true, false);
          tmpV.set(u.side, 0.62, 0.05); u.on.head.localToWorld(tmpV);
          b.position.copy(tmpV);
          const f = 0.2 + Math.abs(Math.sin(u.t * 2)) * 0.9; // 止まって羽をゆっくり開閉
          u.w[0].rotation.z = f; u.w[1].rotation.z = -f;
          u.stay -= dt;
          if (u.stay <= 0 || !persons.includes(u.on)) { u.on = null; u.next = rnd(5, 12); u.target.set(rnd(-4, 4), rnd(1, 3.5), rnd(-1, 2.5)); }
          continue;
        }
        u.next -= dt;
        let landing = null;
        if (u.next <= 0 && persons.length) {
          if (!u.want) { u.want = pick(persons); u.side = rnd(-0.15, 0.15); }
          if (butterflies.some(o => o !== b && o.userData.on === u.want)) { u.want = null; u.next = 2; }
          else { u.want.head.updateWorldMatrix(true, false); landing = u.want.head.localToWorld(tmpV.set(u.side, 0.62, 0.05)).clone(); }
        }
        const goal = landing || u.target;
        if (!landing && b.position.distanceTo(u.target) < 0.4) u.target.set(rnd(-4.5, 4.5), rnd(0.8, 4), rnd(-1.5, 3));
        // ふらふら: 目標に向かいながら上下に揺れる
        const dir = goal.clone().sub(b.position);
        const dist = dir.length();
        if (landing && dist < 0.08) { u.on = u.want; u.want = null; u.stay = rnd(3, 7); continue; }
        dir.normalize().multiplyScalar(landing ? Math.min(1.6, dist * 2.5) : 1.4);
        u.v.lerp(dir, 1 - Math.exp(-dt * 2.5));
        b.position.addScaledVector(u.v, dt);
        if (!landing) b.position.y += Math.sin(u.t * 7) * dt * 0.8;
        b.rotation.y = Math.atan2(u.v.x, u.v.z);
        const f = Math.sin(u.t * 28) * 1.1;
        u.w[0].rotation.z = f; u.w[1].rotation.z = -f;
      }
      // 風船
      balloonT -= dt;
      if (!balloonOn && balloonT <= 0) { balloonOn = true; balloon.position.set(rnd(-9, 9), 1, rnd(-14, -9)); balloonM.color.set(pick(['#e8344a', '#ffd23a', '#3a7be0', '#4ab07a', '#ff8ab0'])); }
      balloon.visible = balloonOn;
      if (balloonOn) {
        balloon.position.y += dt * 1.1; balloon.position.x += Math.sin(now * 0.7) * dt * 0.4;
        balloon.rotation.z = Math.sin(now * 1.3) * 0.12;
        if (balloon.position.y > 40) { balloonOn = false; balloonT = rnd(10, 22); }
      }
    }

    // ---------- ループ ----------
    const STEP = 1 / 60;
    function render(alpha) {
      for (const p of persons) {
        p.g.position.lerpVectors(p.prevPos, p.pos, alpha);
        const tt = performance.now() / 1000 + p.sway;
        const laughing = gameT >= p.laughStart && gameT < p.laughEnd, listening = p.listenEnd > gameT && p.talkEnd < gameT;
        if (laughing) p.g.position.y += Math.abs(Math.sin(gameT * 18)) * 0.05;
        p.g.rotation.z = Math.sin(tt * 1.3) * 0.015;
        p.g.rotation.y = p.turn * 0.3;
        p.head.rotation.z = Math.sin(tt * 0.9) * 0.04;
        p.head.rotation.x = laughing ? -0.18 : listening ? Math.max(0, Math.sin(gameT * 7)) * 0.12 : 0;
        if (p.complain !== undefined && state !== 'play') p.head.rotation.y = Math.sin(p.complain * 22) * 0.12 * Math.max(0, 1 - p.complain * 1.2);
        else p.head.rotation.y = p.turn * 0.7 + Math.sin(tt * 0.6) * 0.05;
        if (p.cat) { drawCat(p.o); continue; }
        if (p.complain === undefined) { p.ooh.visible = p.m > 0.04; p.ooh.scale.set(0.07, 0.015 + 0.08 * p.m, 0.04); }
        const a = OPEN_A + (CLOSE_A - OPEN_A) * (1 - p.o);
        for (const e of p.eyes) { e.lid.rotation.x = a; e.look.rotation.y += (p.lx - e.look.rotation.y) * 0.3; e.look.rotation.x += (-p.ly - e.look.rotation.x) * 0.3; }
      }
      updateCamera();
      renderer.render(scene, camera);
    }
    let last = performance.now(), acc = 0;
    function loop(now) {
      window.resultAd?.(state === 'result'); // 結果画面の広告（../../ad.js）
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      acc += dt;
      while (acc >= STEP) { stepGame(STEP); acc -= STEP; }
      ambient(dt);
      if (shotReq) { shotReq = false; if (state === 'play') { doShot(); requestAnimationFrame(loop); return; } }
      render(acc / STEP);
      requestAnimationFrame(loop);
    }

    resize();
    start();
    if (window.__KF_ZH__) lang = 'zh';
    applyLang();
    // 最初の1回が重くならないように、一度描いておく
    { const extra = makeHuman('normal'); scene.add(shade(extra.g)); extra.g.position.set(0, 0, -30); renderer.compile(scene, camera); renderer.render(scene, camera); scene.remove(extra.g); }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>
  <!-- 結果画面の広告（../../ad.js の説明を参照） -->

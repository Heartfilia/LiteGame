<!doctype html><html lang="zh-CN"><head><script src="../../assets/js/server-sync.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>泡泡龙 · LiteGame</title><link rel="icon" href="../../assets/images/covers/bubble-shooter.svg"><link rel="stylesheet" href="../lib/port.css"><link rel="stylesheet" href="../lib/casual.css"></head><body><main class="casual-page"><header><a href="../../index.html#casual">← 游戏厅</a><h1>泡泡龙</h1></header><div class="port-toolbar"><button id="port-start">开始 / 继续</button><button id="port-pause">暂停</button><button id="port-save">存档</button><button id="port-reset">重新开始</button></div><p id="casual-loading" role="status">正在加载… <a href="">重新载入</a></p><div id="casual-stats" class="casual-stats"></div><div class="casual-stage"><canvas id="casual-board" width="480" height="580" aria-label="泡泡棋盘，点击瞄准发射"></canvas></div><div class="casual-aim"><label for="aim">瞄准</label><input id="aim" type="range" min="-72" max="72" value="0" aria-label="发射角度"><button id="fire">发射</button></div><div class="casual-actions"><button id="swap">交换下一球</button><button id="casual-next" hidden>下一关</button><button id="casual-retry" hidden>重试本关</button></div><div id="casual-message" class="casual-message" role="status"></div><p id="casual-pause" class="port-note"></p><div id="port-status" role="status"></div><details><summary>玩法说明</summary><p class="casual-help">清空棋盘即可过关，共 20 关，不限时间。点击画面瞄准发射，或拖动角度滑杆后点发射；左右键调整，空格发射。虚线展示碰壁反弹轨迹。<br>同色三个以上相连会消除，失去顶部支撑的泡泡也会掉落。每关发射次数有限，用完或泡泡到达警戒线则失败，可重试本关。下一球可交换，颜色同时用数字区分。进度每步保存，通关后点击下一关。</p></details><footer class="casual-credit">基于 Rembound.com 的 Bubble Shooter HTML5（MIT）进行规则移植和关卡扩展。<a href="SOURCE.md">源码与修改说明</a> · <a href="LICENSE">许可证</a></footer></main><script src="../lib/casual-loader.js" data-port="bubble-shooter"></script></body></html>

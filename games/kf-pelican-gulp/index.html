      if (!snap0) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'pelican-gulp.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;

    // ---------- ループ ----------
    updateNeckBase();
    headPos.copy(restPoint()); headPrev.copy(headPos); target.copy(headPos);
    if (window.__KF_ZH__) lang = 'zh';
    applyLang();
    renderControls();
    resize();
    draw(1, 0); // 最初のフレームで固まらないよう先に1回描く
    let acc = 0, last = performance.now();
    function loop(tm) {
      const dt = Math.min(0.05, (tm - last) / 1000); last = tm;
      acc += dt;
      while (acc >= DT) { step(); acc -= DT; }
      draw(acc / DT, dt);
      // 描いた直後なら WebGL の画面を読み取れる
      if (state === 'result' && snapAt > 0 && resultT >= snapAt && !snap0) { takeSnap(); prepareShare(); }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(loop); });
  </script>

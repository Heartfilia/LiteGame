let eng = null;
function engineStart() {

    const whine = ac.createOscillator(), wg = ac.createGain(); whine.type = 'sawtooth'; whine.frequency.value = 900; wg.gain.value = 0;
    const wf = ac.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 1800; wf.Q.value = 3; whine.connect(wf).connect(wg).connect(master); whine.start();

  set(eng.hg.gain, m.ion * .07); set(eng.hum.frequency, 200 + Math.sin(n * 3) * 20);

}
function engineStop() {
  if (!eng) return;

}

// a sketchy pen: paths get wobble and overshoot, fills get a coloured-pencil hatch
function Pen(g, s, seed) {
  const r = mulberry(seed);
  const amp = clamp(s * .022, .5, 2.4), lw = clamp(s * .034, 1.1, 3.4);
  function path(pts, closed, a = amp) {
    g.beginPath();
    const P = closed ? [...pts, pts[0]] : pts;
    let first = true;
    for (let i = 0; i < P.length - 1; i++) {
      const [x0, y0] = P[i], [x1, y1] = P[i + 1];
      const len = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(len / 14));
      const nx = -(y1 - y0) / (len || 1), ny = (x1 - x0) / (len || 1);
      for (let k = 0; k <= n; k++) {
        if (k === 0 && !first) continue;
        const u = k / n, o = (r() - .5) * 2 * a;
        const x = x0 + (x1 - x0) * u + nx * o, y = y0 + (y1 - y0) * u + ny * o;
        if (first) { g.moveTo(x, y); first = false; } else g.lineTo(x, y);
      }
    }
  }
  const api = {
    r, amp, lw,
    fill(pts, color, hatch = true) {
      g.save();

      if (hatch) {
        g.clip(); g.globalAlpha = .22; g.strokeStyle = shade(color, -.45); g.lineWidth = Math.max(.7, lw * .45);
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (const [x, y] of pts) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
        const sp = Math.max(2.5, lw * 1.6), hgt = maxY - minY;
        g.beginPath();
        for (let x = minX - hgt; x < maxX; x += sp) { const j = (r() - .5) * sp * .5; g.moveTo(x + j, maxY + 2); g.lineTo(x + hgt + j + (r() - .5) * 2, minY - 2); }

        g.globalAlpha = .25; g.strokeStyle = '#fff'; g.beginPath();

    rect(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; },
    rrect(x, y, w, h, rr) {
      const p = [], q = (cx, cy, a0) => { for (let i = 0; i <= 3; i++) { const a = a0 + i / 3 * Math.PI / 2; p.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); } };

    cat(cx, cy, rr) {

    },
  };

}

// ================= world objects =================
let debris = [], particles = [], obstacles = [], ejectCat = null;
function spawnPuff(x, y, n, color, sp = 3) {

}
function explode(x, y) {

  for (const p of R.parts) { const [wx, wy] = toWorld(p.x, p.y); debris.push({ id: p.id, x: wx, y: wy, vx: R.vx * .3 + (Math.random() - .5) * 10, vy: R.vy * .3 + Math.random() * 8, th: R.th, w: (Math.random() - .5) * 10, mirror: p.side < 0, life: 5, burnt: true }); }

// obstacle bands (altitude in blocks)

const BANDS = [
  { kind: 'bird', y0: 25, y1: 400, gap: 45 },
  { kind: 'plane', y0: 140, y1: 1500, gap: 170 },
  { kind: 'storm', y0: 280, y1: 2500, gap: 240 },
  { kind: 'geese', y0: 350, y1: 2200, gap: 260 },
  { kind: 'wballoon', y0: 700, y1: 1e9, gap: 420 },
  { kind: 'jet', y0: 1300, y1: 1e9, gap: 360 },
  { kind: 'ufo', y0: 3000, y1: 1e9, gap: 2000 },

let nextSpawn;
function resetObstacles() {
  obstacles = []; nextSpawn = BANDS.map(b => b.y0 + Math.random() * b.gap);
}
function spawnObstacles(viewH) {
  const alt = R.y - R.y0;
  BANDS.forEach((b, i) => {
    while (nextSpawn[i] < alt + viewH * 1.2 && nextSpawn[i] < b.y1) {
      const y = nextSpawn[i] + R.y0;
      const lead = R.vy > 1 ? (y - R.y) / R.vy : 2;
      const cx = R.x + R.vx * lead;
      const spread = Math.max(12, viewH * .5);
      const dir = Math.random() < .5 ? -1 : 1;
      if (b.kind === 'bird') { const n = 2 + (Math.random() * 3 | 0), bx = cx + (Math.random() - .5) * spread * 1.4; for (let k = 0; k < n; k++) obstacles.push({ kind: 'bird', x: bx + k * 1.6 * dir, y: y + (k % 2) * 1.2, vx: -dir * (2.5 + Math.random()), vy: 0, r: .6, ph: Math.random() * 7 }); }
      if (b.kind === 'plane') obstacles.push({ kind: 'plane', x: cx - dir * (spread * .9 + 10), y, vx: dir * (16 + Math.random() * 6), vy: 0, r: 1.6, len: 7, ph: 0 });
      if (b.kind === 'storm') obstacles.push({ kind: 'storm', x: cx + (Math.random() - .5) * spread, y, vx: (Math.random() - .5) * 2, vy: 0, r: 3.6, ph: Math.random() * 7, seed: Math.random() * 1e9 | 0 });
      // geese fly in a V across the sky
      if (b.kind === 'geese') { const bx = cx - dir * spread * .8; for (let k = 0; k < 7; k++) { const row = Math.ceil(k / 2), side = k % 2 ? 1 : -1; obstacles.push({ kind: 'bird', x: bx - dir * row * 1.4, y: y + side * row * 1.1, vx: dir * 6, vy: 0, r: .6, ph: Math.random() * 7 }); } }

      if (b.kind === 'jet') obstacles.push({ kind: 'plane', jet: 1, x: cx - dir * (spread * 1.1 + 12), y, vx: dir * (34 + Math.random() * 10), vy: 0, r: 1.6, len: 7, ph: 0 });

}
function stepObstacles(dt) {

}
function hitObstacle() {
  if (!R.parts.length || R.inv > 0) return null;
  const segs = R.parts.map(p => { const rr = Math.min(p.w, p.h) * .45, half = Math.max(0, Math.max(p.w, p.h) / 2 - rr), vert = p.h >= p.w; return [toWorld(p.x - (vert ? 0 : half), p.y - (vert ? half : 0)), toWorld(p.x + (vert ? 0 : half), p.y + (vert ? half : 0)), rr, p]; });

// what a collision does: birds bonk, lightning stuns the engines, anything big knocks off the part it hit
function handleHit({ o, part, px, py }) {

    return;
  }

  particles.push({ kind: 'boom', front: 1, x: wx, y: wy, vx: 0, vy: 0, r: 1, life: .3, max: .5 });
  sfx.boom(.45);

// ================= game state =================
let state = 'build';     // build | flight | over | result
let overT = 0, overKind = '', result = null, best = store.get('best', 0), bestMoon = store.get('bestMoon', false);
let keysL = false, keysR = false, steerDrag = null, prevR = null, warp = 1, steered = store.get('steered', false);
let touched = store.get('touched', false);

function launch() {
  if (state !== 'build') return;
  steerDrag = null;
  if (!layout(rk, true).parts.length) return;
  saveRocket();
  makeFlight();
  debris = []; particles = []; ejectCat = null; resetObstacles();
  // parts that touch nothing stay behind on the pad
  for (const p of layout(rk).parts) if (!p.attached) debris.push({ id: p.id, x: p.x, y: p.y, vx: 0, vy: 0, th: 0, w: 0, mirror: p.side < 0, life: 1e9 });
  windT = Math.random() * 100;
  state = 'flight'; overT = 0; overKind = ''; warp = 1;
  prevR = { x: R.x, y: R.y, th: R.th };
  cam.scale = buildCam.scale; cam.x = 0; cam.y = R.y; cam.rot = 0;
  sfx.ignite(); engineStart();
  setUI();
}
function endFlight(kind) {
  if (state !== 'flight') return;
  state = 'over'; overKind = kind; overT = 0;
  if (kind === 'crash' || kind === 'breakup' || kind === 'hit') { const [wx, wy] = [R.x, R.y]; explode(wx, wy); sfx.boom(); setTimeout(() => meow(false), 350); }

  setUI();
}

  state = 'result';
  const moon = false;

  result = { km, moon };
  if (km > best) { best = km; store.set('best', best); }
  if (moon) { bestMoon = true; store.set('bestMoon', true); }
  takeSnap();
  showResult(); setUI();
}
function toBuild() { state = 'build'; result = null; engineStop(); setUI(); layoutBuild(); }

const fmtKm = v => (Math.round(v * 10) / 10).toFixed(1);
function showResult() {
  if (!result) return;
  $('rAlt').textContent = L[lang].km(fmtKm(result.km));
  $('rBest').textContent = result.moon ? t('moon') : `${t('best')} ${L[lang].km(fmtKm(best))}`;
  const a = $('share'), text = result.moon ? t('postMoon') : L[lang].post(fmtKm(result.km));
  a.href = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(URL_)}`;
  if (coarse) { a.removeAttribute('target'); a.removeAttribute('rel'); } else { a.target = '_blank'; a.rel = 'noopener'; }

}
$('again').onclick = () => { $('result').hidden = true; state = 'build'; launch(); };
$('edit').onclick = () => toBuild();
// stop the flight at any moment and go back to building (the height so far still counts for the best)
function abortFlight() {
  if (state !== 'flight' && state !== 'over') return;
  if (R) { const km = Math.round(R.maxY) / 10; if (km > best) { best = km; store.set('best', best); } }
  steerDrag = null; particles = []; debris = []; ejectCat = null; obstacles = [];
  sfx.tab(); toBuild();
}
$('abort').onclick = abortFlight;
$('launch').onclick = () => launch();
$('clear').onclick = () => { if (!rk.length) return; for (const p of layout(rk).parts) { const [sx, sy] = buildToScreen(p.x, p.y); poofs.push({ x: sx, y: sy, t: 0 }); } rk = []; saveRocket(); sfx.pop(); layoutBuild(); };

function setUI() {
  $('launch').hidden = state !== 'build';
  $('clear').hidden = state !== 'build';
  $('abort').hidden = state !== 'flight' && state !== 'over';
  $('result').hidden = state !== 'result';
  $('launch').classList.toggle('pulse', !touched);
}

// ---- share ----
$('share').addEventListener('click', e => {
  if (!result) return;
  const text = `${result.moon ? t('postMoon') : L[lang].post(fmtKm(result.km))}\n${URL_}`;
  if (coarse && navigator.share) {
    e.preventDefault();
    const file = shareFile();
    navigator.share(file && navigator.canShare?.({ files: [file] }) ? { files: [file], text } : { text }).catch(() => {});
    return;
  }
  const img = resultImage();
  if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'rocket-maker.png'; d.click(); }
});
let snap = null, shareCache = null;
function takeSnap() {
  // the scene square around the rocket (or what is left of it)
  const dpr = cv.width / cv.clientWidth;
  const [sx0, sy0] = worldToScreen(snapFocus.x, snapFocus.y);
  const side = Math.min(cv.width, cv.height) * .9;
  const sx = clamp(sx0 * dpr - side / 2, 0, cv.width - side), sy = clamp(sy0 * dpr - side * .58, 0, cv.height - side);
  snap = document.createElement('canvas'); snap.width = snap.height = 1080;
  snap.getContext('2d').drawImage(cv, sx, sy, side, side, 0, 0, 1080, 1080);
  shareCache = null;
}
function resultImage() {
  if (!snap || !result) return null;

  const g = c.getContext('2d');
  g.drawImage(snap, 0, 0);
  g.textAlign = 'center'; g.lineJoin = 'round';
  const text = (str, y, px, max, fill, line) => {
    g.font = `${px}px ${FONT}`;
    const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = `${px}px ${FONT}`; }
    g.lineWidth = px * .18; g.strokeStyle = line; g.strokeText(str, 540, y); g.fillStyle = fill; g.fillText(str, 540, y);
  };
  text(L[lang].km(fmtKm(result.km)), 210, 190, 960, INK, '#fffdf6');
  if (result.moon) text(t('moon'), 320, 80, 900, INK, '#fffdf6');
  text(t('title'), 1035, 60, 900, '#fffdf6', INK);

}

  const doIt = () => resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'rocket-maker.png', { type: 'image/png' }); }, 'image/png');

// ================= canvas / layout =================
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const BOTTOM = 80;
const buildCam = { x: 0, y: 0, scale: 40 };
const cam = { x: 0, y: 0, scale: 40, sy: .5 };
let tray = { vertical: false, x: 0, y: 0, w: 0, h: 0, cell: 64, tabs: [], cells: [], scroll: 0, maxScroll: 0, cat: 'body' };
let gaugeBox = { x: 0, y: 0, w: 0, h: 0 };
let buildArea = { x: 0, y: 0, w: 0, h: 0 };
const safeB = () => { const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sab')) || 0; return v; };

function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildView = null;
  layoutBuild();
}
addEventListener('resize', resize);

function layoutBuild() {
  const vertical = H < 560 && W / H > 1.25;
  const cell = clamp(Math.min(W / 5.4, H / 8), 54, 112);
  const tabH = clamp(cell * .6, 36, 48);
  tray.vertical = vertical; tray.cell = cell;
  if (!vertical) {
    tray.x = 0; tray.w = W; tray.h = cell + tabH + 12; tray.y = H - BOTTOM - tray.h;
    const tw = Math.min(W / 4 - 6, 110);
    tray.tabs = CATS.map((c, i) => ({ cat: c, x: W / 2 + (i - 2) * (tw + 6) + 3, y: tray.y, w: tw, h: tabH }));
    const ids = BYCAT[tray.cat];
    tray.cells = ids.map((id, i) => ({ id, x: 10 + i * (cell + 6), y: tray.y + tabH + 8, w: cell, h: cell }));
    const total = ids.length * (cell + 6) + 14;
    tray.maxScroll = Math.max(0, total - W);
    if (total < W) { const off = (W - total) / 2; tray.cells.forEach(c => c.x += off); }
    buildArea = { x: 0, y: 56, w: W, h: tray.y - 56 - 8 };
  } else {
    const tabW = clamp(cell * .7, 40, 52);
    tray.w = tabW + cell * 2 + 24; tray.x = W - tray.w; tray.y = 52; tray.h = H - BOTTOM - 52 + 30;
    const th = Math.min((tray.h - 12) / 4 - 6, 70);
    tray.tabs = CATS.map((c, i) => ({ cat: c, x: tray.x + 4, y: tray.y + 4 + i * (th + 6), w: tabW, h: th }));
    const ids = BYCAT[tray.cat];
    tray.cells = ids.map((id, i) => ({ id, x: tray.x + tabW + 12 + (i % 2) * (cell + 6), y: tray.y + 4 + Math.floor(i / 2) * (cell + 6), w: cell, h: cell }));
    const total = Math.ceil(ids.length / 2) * (cell + 6) + 8;
    tray.maxScroll = Math.max(0, total - tray.h);
    buildArea = { x: 0, y: 50, w: tray.x, h: H - BOTTOM - 50 + 20 };
  }
  tray.scroll = clamp(tray.scroll, 0, tray.maxScroll);
  // fit the rocket (plus some room to drop parts above it) in the build area
  const lay = layout(rk);
  const rw = lay.maxX - lay.minX;
  const needH = FRAME.h + 1.4, needW = FRAME.w + .6;
  const sc = clamp(Math.min((buildArea.h - 20) / needH, (buildArea.w * (vertical ? .62 : .94)) / needW), 14, 120);
  buildCam.scale = sc;
  buildCam.groundY = buildArea.y + buildArea.h - Math.max(18, sc * .6);
  buildCam.cx = buildArea.x + buildArea.w / 2;
  if (buildView) { buildCam.scale = buildView.scale; buildCam.cx = buildView.cx; buildCam.groundY = buildView.gy; }
  // DOM buttons beside the rocket
  const lb = $('launch'), cb = $('clear');
  if (!vertical) {
    lb.style.right = '14px'; lb.style.left = 'auto'; lb.style.top = '60px'; lb.style.bottom = 'auto';
    cb.style.left = 'auto'; cb.style.right = '14px'; cb.style.top = (66 + lb.offsetHeight + 12) + 'px'; cb.style.bottom = 'auto';
    gaugeBox = { x: 14, y: 60, w: clamp(W * .2, 70, 120), h: 0 };
  } else {
    lb.style.left = 'auto'; lb.style.right = (W - tray.x + 12) + 'px'; lb.style.bottom = (BOTTOM + 4) + 'px'; lb.style.top = 'auto';
    cb.style.left = '14px'; cb.style.right = 'auto'; cb.style.bottom = (BOTTOM + 4) + 'px'; cb.style.top = 'auto';
    gaugeBox = { x: 14, y: 56, w: clamp(W * .14, 64, 110), h: 0 };
  }
}
// build view: block coordinates -> screen
const buildToScreen = (x, y) => [buildCam.cx + x * buildCam.scale, buildCam.groundY - y * buildCam.scale];
const screenToBuild = (sx, sy) => [(sx - buildCam.cx) / buildCam.scale, (buildCam.groundY - sy) / buildCam.scale];
// flight view: world -> screen
const worldToScreen = (x, y) => [W / 2 + (x - cam.x) * cam.scale, H * cam.sy - (y - cam.y) * cam.scale];

// ================= build interaction =================
let pending = null, drag = null, tip = null, poofs = [], snapFx = [], nudge = null;
function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

function trayHit(x, y) {
  for (const tb of tray.tabs) if (inRect(x, y, tb)) return { tab: tb.cat };
  for (const c of tray.cells) { const r = cellRect(c); if (inRect(x, y, r) && (tray.vertical ? y > tray.y : true)) return { id: c.id }; }
  if (inRect(x, y, tray)) return { tray: true };

}
function partHit(x, y) {
  const [bx, by] = screenToBuild(x, y);
  let hit = null;
  for (const p of layout(rk).parts) {
    if (Math.abs(bx - p.x) <= p.w / 2 + .08 && Math.abs(by - p.y) <= p.h / 2 + .05) { if (!hit || p.side) hit = p; }

    ['flame', clamp(st.twr / 3, 0, 1), st.twr < 1 ? COL.red : st.twr < 1.3 ? COL.yellow : COL.green, 1 / 3],
    ['drop', clamp(st.fuel / 10, 0, 1), st.fuel <= 0 ? COL.red : COL.orange, null],
    ['fin', clamp((st.margin + .5) / 2.5, 0, 1), st.margin < 0 ? COL.red : st.margin < .4 ? COL.yellow : COL.green, .2],
  ];
  const p = Pen(g, 30, 11);
  const rh = 26;
  rows.forEach(([icon, k, c, mark], i) => {
    const yy = y + i * (rh + 8);
    const ix = x + 10, iy = yy + rh / 2;
    if (icon === 'flame') flame(g, ix, iy, 1);
    if (icon === 'drop') drop(g, ix, iy, 7);
    if (icon === 'fin') { const pts = [[ix - 6, iy - 9], [ix + 2, iy - 1], [ix + 8, iy + 9], [ix - 6, iy + 9]]; p.shape(pts, COL.red, 1.6); }
    const bx = x + 24, bw = w - 24;
    p.fill(p.rect(bx, yy + 6, bw * k, rh - 12), c);
    p.line(p.rrect(bx, yy + 6, bw, rh - 12, 5), true, 1.8);

  });

}
// tooltip: the part's name and what it is good at, in pips
function partStats(id) {
  const d = PARTS[id];
  return [
    ['w', clamp(Math.ceil((d.m + (d.fuel || 0)) / .5), 1, 5)],
    ['p', d.T ? clamp(Math.ceil(d.T / 16), 1, 5) : d.lift ? 2 : d.solar ? 1 : 0],
    ['f', d.fuel ? clamp(Math.ceil(d.fuel / .7), 1, 5) : d.own ? clamp(Math.ceil(d.own / .8), 1, 4) : 0],
    ['c', d.gyro ? 4 : d.rcs ? 4 : d.gimbal ? 4 : d.fin ? Math.ceil(d.fin * 1.5) : 0],

}
function drawTip(g) {
  if (!tip || drag) return;
  const id = tip.id, name = pname(id);
  const d = PARTS[id];
  g.font = `${clamp(W * .045, 17, 24)}px ${FONT}`;
  const tw = g.measureText(name).width;
  const stats = partStats(id).filter(s => s[1] > 0);
  const flags = [d.air && 'air', d.chute && 'chute', (d.decoup || d.sep) && 'sep', d.wobble && 'wobble', d.lift && 'air'].filter(Boolean);
  const bw = Math.max(tw + 24, stats.length * 64 + 20), bh = 66;
  let bx = clamp((tray.vertical ? buildArea.w / 2 : W / 2) - bw / 2, 8, W - bw - 8);
  let by = tray.vertical ? 56 : tray.y - bh - 14;
  if (!tray.vertical && drag) by = 124;
  const p = Pen(g, 40, 21);
  const box = p.rrect(bx, by, bw, bh, 12);

    g.save(); g.strokeStyle = INK; g.lineWidth = 1.6;
    if (k === 'w') { g.fillStyle = COL.dark; g.beginPath(); g.moveTo(x - 7, y + 6); g.lineTo(x - 4, y - 5); g.lineTo(x + 4, y - 5); g.lineTo(x + 7, y + 6); g.closePath(); g.fill(); g.stroke(); }

    if (k === 'c') { g.beginPath(); g.arc(x, y + 3, 7, Math.PI * 1.1, Math.PI * 1.95); g.stroke(); g.beginPath(); g.moveTo(x + 7, y + 1); g.lineTo(x + 8, y - 5); g.lineTo(x + 2, y - 2); g.stroke(); }
    g.restore();

    g.save(); g.strokeStyle = INK; g.lineWidth = 1.5;
    if (f === 'air') { g.fillStyle = '#fff'; g.beginPath(); g.arc(x - 4, y, 5, 0, 7); g.arc(x + 3, y - 2, 6, 0, 7); g.arc(x + 7, y + 2, 4, 0, 7); g.fill(); g.stroke(); }
    if (f === 'space') { g.fillStyle = COL.yellow; g.beginPath(); for (let j = 0; j < 10; j++) { const a = j / 10 * Math.PI * 2 - Math.PI / 2, r2 = j % 2 ? 3.5 : 8; g.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2); } g.closePath(); g.fill(); g.stroke(); }
    if (f === 'chute') { g.fillStyle = COL.orange; g.beginPath(); g.arc(x, y + 2, 8, Math.PI, 0); g.closePath(); g.fill(); g.stroke(); g.beginPath(); g.moveTo(x - 8, y + 2); g.lineTo(x, y + 10); g.lineTo(x + 8, y + 2); g.stroke(); }
    if (f === 'sep') { g.beginPath(); g.moveTo(x - 8, y - 2); g.lineTo(x + 8, y - 2); g.moveTo(x - 8, y + 4); g.lineTo(x + 8, y + 4); g.stroke(); g.beginPath(); g.moveTo(x, y + 6); g.lineTo(x, y + 11); g.stroke(); }
    if (f === 'wobble') { g.beginPath(); for (let j = 0; j <= 8; j++) g.lineTo(x - 8 + j * 2, y + Math.sin(j * 1.6) * 4); g.stroke(); }

let hintT = 0;
function drawBuild(fdt, frame) {
  const s = buildCam.scale;
  drawPaper(0, 0, 0, 0, s);
  const toS = buildToScreen;
  layoutH = layout(rk).H;
  drawGround((x, y) => toS(x, y), s, frame);
  drawPad(toS, s, frame);
  drawFrame(fdt, frame);
  // rocket
  const lay = layout(rk);
  // stages: a highlighter wash behind each part, one colour per stage (only when there are decouplers)
  if (lay.maxStage > 0) {
    const hp = Pen(ctx, s, 1200 + frame);

  drawRocketParts(ctx, lay.parts.filter(p => !p.attached), (x, y) => toS(x, y), s, frame, { alpha: .4 });

  for (const q of lay.parts) {

    ctx.save(); ctx.globalAlpha = q.attached ? 1 : .5;
    ctx.fillStyle = q.attached ? STAGE_COL[q.stage % STAGE_COL.length] : '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ctx.font = `bold ${r * 1.3}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(rk[q.idx].o || 1), cx, cy + r * .08);
    ctx.restore();
  }

  // grey dashes = will be loose, a red cross = that spot is taken
  if (drag) {
    const t2 = drag.tgt, d = PARTS[drag.id];
    if (t2) {
      const w = cw(drag.id) * CELL, h = ch(drag.id) * CELL, cx0 = (t2.x + cw(drag.id) / 2) * CELL - FRAME.w / 2, cy0 = (t2.y + ch(drag.id) / 2) * CELL;
      const [cx, cy] = toS(cx0, cy0), facing = d.cat === 'side' ? (cx0 < 0 ? -1 : 1) : 0;
      drawPart(ctx, drag.id, cx, cy, s, frame, facing < 0, t2.ok ? (t2.joined ? .95 : .5) : .35);
      ctx.save(); ctx.lineWidth = 2.5;
      if (t2.ok) { ctx.setLineDash([6, 5]); ctx.strokeStyle = t2.joined ? COL.red : 'rgba(45,42,50,.5)'; ctx.strokeRect(cx - w * s / 2, cy - h * s / 2, w * s, h * s); }
      else { ctx.strokeStyle = COL.red; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cx - 12, cy - 12); ctx.lineTo(cx + 12, cy + 12); ctx.moveTo(cx + 12, cy - 12); ctx.lineTo(cx - 12, cy + 12); ctx.stroke(); }
      ctx.restore();

  }

  for (let i = snapFx.length - 1; i >= 0; i--) { const f = snapFx[i]; f.t += fdt; if (f.t > .35) { snapFx.splice(i, 1); continue; } ctx.strokeStyle = `rgba(45,42,50,${1 - f.t / .35})`; ctx.lineWidth = 2; for (let j = 0; j < 8; j++) { const a = j / 8 * Math.PI * 2, r0 = f.r * .6 + f.t * 80, r1 = r0 + 8; ctx.beginPath(); ctx.moveTo(f.x + Math.cos(a) * r0, f.y + Math.sin(a) * r0); ctx.lineTo(f.x + Math.cos(a) * r1, f.y + Math.sin(a) * r1); ctx.stroke(); } }
  for (let i = poofs.length - 1; i >= 0; i--) { const f = poofs[i]; f.t += fdt; if (f.t > .45) { poofs.splice(i, 1); continue; } const k = f.t / .45; ctx.fillStyle = `rgba(255,255,255,${1 - k})`; ctx.strokeStyle = `rgba(45,42,50,${(1 - k) * .7})`; ctx.lineWidth = 1.5; for (let j = 0; j < 6; j++) { const a = j / 6 * Math.PI * 2; ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * (8 + k * 30), f.y + Math.sin(a) * (8 + k * 30), 6 + k * 6, 0, 7); ctx.fill(); ctx.stroke(); } }

  if (!touched && !drag) {

// ================= drawing: flight =================
let snapFocus = { x: 0, y: 0 };
function drawFlight(fdt, k, frame) {
  // interpolated rocket pose
  let rx = lerp(prevR.x, R.x, k), ry = lerp(prevR.y, R.y, k);
  if (ejectCat && state !== 'flight') { rx = ejectCat.x; ry = ejectCat.y + 1; }
  const rth = prevR.th + wrapA(R.th - prevR.th) * k;
  const pose = { x: rx, y: ry, th: rth, comX: R.comX, comY: R.comY };
  // camera: zoom out with speed, keep the rocket a little below the middle
  const spd = Math.hypot(R.vx, R.vy);
  const rocketLen = Math.max(4, R.top - R.bot);
  let viewU = clamp(rocketLen * 2.3 + spd * .2, 9, 90);
  if (state === 'over' || state === 'result') viewU = clamp(rocketLen * 3 + 6, 10, 60);
  if (overKind === 'moon') viewU = rocketLen * 2.6 + 8;

  const avail = Math.min(Math.max(W, (H - BOTTOM - 60) * .75), H - BOTTOM - 60);
  const tScale = avail / viewU * flightZoom;
  cam.scale = lerp(cam.scale, tScale, Math.min(1, fdt * 2.5));
  const sy = state === 'result' ? .64 : .55;
  cam.sy = lerp(cam.sy, sy, Math.min(1, fdt * 3));

  // keep the ground near the bottom of the screen at lift-off, then follow the rocket
  const floorY = overKind === 'moon' ? -Infinity : (H - BOTTOM * .5 - H * cam.sy) / cam.scale;
  if (state === 'flight') { cam.x = rx; cam.y = Math.max(ry, floorY); }
  else { cam.x = lerp(cam.x, rx, Math.min(1, fdt * 4)); cam.y = lerp(cam.y, Math.max(ry, floorY), Math.min(1, fdt * 4)); }
  snapFocus = { x: rx, y: ry };
  const s = cam.scale;
  const topY = cam.y + H * cam.sy / s - R.y0, botY = cam.y - (H - H * cam.sy) / s - R.y0;
  drawPaper(topY, botY, cam.x * s, cam.y * s, s);
  ctx.save();
  const view = { x0: cam.x - W / 2 / s, x1: cam.x + W / 2 / s, y0: cam.y - (H - H * cam.sy) / s, y1: cam.y + H * cam.sy / s };
  drawClouds(view);
  drawGround(worldToScreen, s, frame);
  drawPad(worldToScreen, s, frame);
  // debris
  for (const d of debris) {
    const [sx, sy2] = worldToScreen(d.x, d.y);
    ctx.save(); ctx.translate(sx, sy2); ctx.rotate(d.th);
    if (d.burnt) ctx.filter = 'brightness(.55)';
    drawPart(ctx, d.id, 0, 0, s, frame, d.mirror, clamp(d.life, 0, 1));
    ctx.restore();
  }

  stepParticles(fdt);
  drawParticles(ctx, false);

    const shake = R.onPad && R.thrust > 0 ? (Math.random() - .5) * 2 * (1 + R.padShake) : 0;
    const toS = (lx, ly) => { const [wx, wy] = toWorld(lx, ly, pose); const [a, b] = worldToScreen(wx, wy); return [a + shake, b]; };

      const [nx, ny] = toS(R.comX, R.top + R.comY);
      const p = Pen(ctx, s, 600 + frame), cw = s * 3.4, ch = s * 2;
      const tx2 = nx - Math.sin(rth) * s * 3.2, ty2 = ny - Math.cos(rth) * s * 3.2;
      for (const sgn of [-1, 1]) p.line([[nx, ny], [tx2 + sgn * cw * .5, ty2]], false, 1.2);
      const pts = []; for (let i = 0; i <= 10; i++) { const a = Math.PI + i / 10 * Math.PI; pts.push([tx2 + Math.cos(a) * cw * .5, ty2 + Math.sin(a) * ch * .55]); }
      p.shape(pts, COL.orange); for (let i = 1; i < 4; i++) p.line([[tx2 - cw * .5 + i * cw / 4, ty2], [tx2, ty2 - ch * .55]], false, 1.2);
    }
    // flames first (behind)
    for (const p of R.parts) {
      if (!p.burning) continue;
      const d = PARTS[p.id];
      const [nx, ny] = toS(p.x, p.y - p.h / 2);
      drawFlame(ctx, d.fx, nx, ny, s * Math.min(1.3, p.w), d.T / 40, rth, R.t);
    }
    ctx.save();
    const sorted = [...R.parts].sort((a, b) => (a.side ? 0 : 1) - (b.side ? 0 : 1));
    for (const p of sorted) {
      const [sx, sy2] = toS(p.x, p.y);
      ctx.save(); ctx.translate(sx, sy2); ctx.rotate(rth);

  ctx.restore();

    drawWarnings(ctx);
    drawSteer(ctx);

}

// ================= main loop =================
let last = performance.now(), acc = 0, frameT = 0, frame = 0;
function update(dt) {
  if (state === 'flight') {
    // time runs faster on the long coast through space
    const alt = R.y - R.y0;
    warp = 1;
    const u = steer();
    acc += dt * warp;
    let steps = 0;
    while (acc >= DT && steps < 120) {
      acc -= DT; steps++;
      prevR = { x: R.x, y: R.y, th: R.th };
      const res = physStep(DT, u);
      stepObstacles(DT);
      for (const d of debris) { d.vy -= G0 * DT; d.x += d.vx * DT; d.y += d.vy * DT; d.th += d.w * DT; if (d.y < 0) { d.y = 0; d.vy = 0; d.vx *= .9; d.w *= .9; } }
      if (res) { endFlight(res); break; }
      if (R.inv > 0) R.inv -= DT;
      const hit = hitObstacle();
      if (hit) {
        handleHit(hit);
        if (!R.parts.length) { R.parts = []; endFlight('hit'); break; }
      }
      // out of push and heading down: the flight is over
      const altNow = R.y - R.y0;
      // heading down for a while: the flight is over. engines still burning get longer to win it back,
      // and a very long flight ends anyway
      if (!R.onPad && R.vy < (R.thrust > 0 ? -1.5 : 0)) {
        R.fallT += DT;
        if (R.maxY > 250 && R.fallT > (R.chuteOpen ? 2.5 : R.thrust > 0 ? 4 : 1.6)) { endFlight(R.chuteOpen ? 'chuteEnd' : 'fall'); break; }
      } else R.fallT = 0;
      if (R.t > 240 && R.vy < 0) { endFlight('fall'); break; }
      // never left the pad
      if (R.onPad && R.padT > 1.2 && R.thrust === 0 && R.active >= R.maxStage) { endFlight('pad'); break; }
      if (R.onPad && R.padT > 6 && R.active >= R.maxStage) { endFlight('pad'); break; }
    }
    if (steps >= 120 || state !== 'flight') acc = 0;
    if (state === 'flight') {
      spawnObstacles(H / cam.scale);

        if (!p.burning || Math.random() > dt * 30) continue;
        const d = PARTS[p.id]; if (d.fx === 'ion') continue;
        const [wx, wy] = toWorld(p.x, p.y - p.h / 2 - .6);
        const air = rho(R.y - R.y0);
        particles.push({ kind: 'puff', soft: 1, x: wx + (Math.random() - .5) * .4, y: wy, vx: R.vx * .2 + (Math.random() - .5) * 2, vy: R.vy * .2 - 2, r: .3, grow: .9 * (.3 + air), life: .3 + air * .9, max: 1.2, color: d.fx === 'water' ? '#d8eefc' : air > .3 ? '#f2f0ea' : '#8e93b8' });
      }
      if (particles.length > 260) particles.splice(0, particles.length - 260);
      const air = rho(R.y - R.y0), spd = Math.hypot(R.vx, R.vy);
      engineSet({ ...R.mix, fire: Math.min(1, R.mix.fire), jet: Math.min(1, R.mix.jet), ion: Math.min(1, R.mix.ion), spark: Math.min(1, R.mix.spark), water: Math.min(1, R.mix.water), wind: Math.min(1, air * spd / 50) });
    }
  }
  if (ejectCat && state !== 'flight') {
    const c = ejectCat; c.t += dt;
    if (c.y > .8) {
      c.vy += (c.t > .5 ? (-1.6 - c.vy) * 3 : -G0) * dt; c.vx *= 1 - dt * 1.5;
      c.x += c.vx * dt; c.y += c.vy * dt;
      if (c.y <= .8) { c.y = .8; c.vy = 0; c.vx = 0; }
    }
  }
  if (state === 'flight') {} else if (state === 'over') {
    overT += dt; acc = 0;
    for (const d of debris) { d.vy -= G0 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.th += d.w * dt; if (d.y < 0) { d.y = 0; d.vy = 0; d.vx *= .9; d.w *= .9; } }
    stepObstacles(dt);
    if (overKind === 'fall' || overKind === 'chuteEnd') { R.vy -= G0 * dt * .5; R.y += R.vy * dt * .3; R.x += R.vx * dt * .3; R.th += (overKind === 'fall' ? 2.5 : 0) * dt; }
    if (overT > (overKind === 'moon' ? 2.2 : 1.6)) finish();
  } else if (state === 'result') {
    for (const d of debris) { if (d.y > 0) { d.vy -= G0 * dt; d.y += d.vy * dt; d.x += d.vx * dt; d.th += d.w * dt; if (d.y < 0) d.y = 0; } }
  }
}
function loop(now) {
  const fdt = Math.min(.05, (now - last) / 1000); last = now;
  frameT += fdt; if (frameT > .16) { frameT = 0; frame = (frame + 1) % 3; }
  update(fdt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (state === 'build') drawBuild(fdt, frame);
  else { if (state !== 'flight') prevR = { x: R.x, y: R.y, th: R.th }; drawFlight(fdt, clamp(acc / DT, 0, 1), frame); }
  requestAnimationFrame(loop);
}
resize(); applyLang(); setUI();
if (document.fonts?.ready) document.fonts.ready.then(() => spriteCache.clear());
drawBuild(0, 0);
requestAnimationFrame(loop);

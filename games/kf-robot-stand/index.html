  }
  // 投げる位置: カメラの右下
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0), up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
  const from = camera.position.clone().addScaledVector(right, 0.35).addScaledVector(up, -0.35).addScaledVector(fwd, 0.8);
  const d = target.clone().sub(from), dist = d.length(), speed = 13 + 15 * power, T = dist / speed; // 長押しで 13〜28 m/s
  const vel = d.divideScalar(T); vel.y += 0.5 * 9.81 * T;
  // 古いボールから片付ける
  if (sim.balls.length >= MAX_BALLS) removeBall(ballPool.find(b => b.ball === sim.balls[0]));
  // 長押しで重く・大きく（2.5〜9kg、半径11〜16cm。重さは押し始めはゆっくり増える）
  const r = BALL_R * (1 + 0.45 * power), ball = sim.throwBall(from, vel, r, 2.5 + 6.5 * power * power);
  ball.prevVel = { x: vel.x, y: vel.y, z: vel.z };
  const slotB = ballPool.find(b => !b.ball);
  slotB.ball = ball; ball.view = slotB;
  slotB.cp.copy(from); slotB.pp.copy(from); slotB.cq.identity(); slotB.pq.identity(); slotB.mesh.scale.setScalar(r / BALL_R); slotB.base = r / BALL_R;
  whoosh(power);
  aimRing.position.copy(target); if (normal) aimRing.lookAt(target.clone().add(normal)); else aimRing.lookAt(camera.position);
  aimT = 0;
  thrown++;
  if (thrown === 1) $('hint').classList.add('off');
}
function removeBall(v) {
  if (!v || !v.ball) return;
  sim.removeBall(v.ball); v.ball = null; v.mesh.position.set(0, -5, 0);
}

// ===== 当たった時の反応 =====
let faceT = 0, voiceCool = 0, crashCool = 0, lastState = sim.state;
sim.onStep = () => { if (every('step', 120)) servo(0.16, 260, 330, 0.025); };
sim.onLand = () => { if (every('land', 90)) clank(0.18, 0.55); };
sim.onFall = () => { wail(); setFace('dizzy'); faceT = 99; snapAt = performance.now() + 550; };
sim.onGetup = () => {};
// 起き上がりの段取りごとにモーター音
sim.onPhase = ph => {
  if (ph === 'roll') servo(0.9, 120, 220, 0.05);
  else if (ph === 'push') servo(0.8, 150, 280, 0.055);
  else if (ph === 'knees') servo(0.6, 180, 260, 0.045);
  else if (ph === 'squat') { servo(0.8, 160, 300, 0.055); clank(0.15, 0.6, 0.5); }
  else if (ph === 'rise') servo(1.0, 140, 360, 0.06);
};
const tmpV = new THREE.Vector3();
function handleHits() {
  for (const h of sim.hits) {
    if (h.ball) {
      const b = h.ball, pv = b.prevVel || { x: 0, y: 0, z: 0 };
      const bp = b.body.translation();
      if (h.part) {
        const v = h.part.body.linvel();
        const rel = Math.hypot(pv.x - v.x, pv.y - v.y, pv.z - v.z);
        if (rel < 1.5) continue;
        const k = Math.min(1, rel / 15);
        const pp = h.part.body.translation();
        tmpV.set(bp.x, bp.y, bp.z).lerp(new THREE.Vector3(pp.x, pp.y, pp.z), 0.35);
        spawnSpark(tmpV, Math.round(4 + 10 * k), 0.4 + k);
        // 重いボールほど低く重い音
        clank(0.25 + 0.75 * k, (h.part.name === 'head' ? 1.25 : h.part.name.startsWith('fore') || h.part.name.startsWith('upper') ? 1.4 : 1) * Math.pow(2.5 / b.mass, 0.25));
        if (sim.state === 'stand' && k > 0.45) {
          if (voiceCool <= 0) { ouch(k); voiceCool = 0.5; }
          setFace('hit'); faceT = 0.55;
        }
      } else {
        const sp = Math.abs(pv.y);
        if (sp > 1.2 && every('thump' + b.collider.handle, 150)) thump(Math.min(1, sp / 8));
      }
    } else if (h.part && sim.state === 'fallen') {
      // 倒れて床にぶつかった
      const n = h.part.name;
      if ((n === 'torso' || n === 'head' || n === 'pelvis') && crashCool <= 0) {
        const v = h.part.body.linvel(), sp = Math.hypot(v.x, v.y, v.z);
        if (sp > 0.8) {
          const p = h.part.body.translation();
          clank(Math.min(1, 0.4 + sp / 4), 0.7); clank(0.5, 0.9, 0.06); clank(0.35, 1.2, 0.13);
          spawnDust(p, 10, 1);
          crashCool = 0.35;
        }
      }
    }
  }
}

// ===== ループ（物理は 1/120 秒きざみ・描画は補間）=====
let acc = 0, last = performance.now(), faceTimer = 0;
const hintPos = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  acc += dt;
  while (acc >= sim.DT) {
    for (const v of visuals) { v.pp.copy(v.cp); v.pq.copy(v.cq); }
    for (const b of ballPool) if (b.ball) { b.pp.copy(b.cp); b.pq.copy(b.cq); const lv = b.ball.body.linvel(); b.ball.prevVel = { x: lv.x, y: lv.y, z: lv.z }; }
    sim.step();
    handleHits();
    for (const v of visuals) readPose(v, { p: v.cp, q: v.cq });
    for (const b of ballPool) if (b.ball) { readPose({ part: b.ball }, { p: b.cp, q: b.cq }); b.ball.age += sim.DT; }
    acc -= sim.DT;
  }
  const a = acc / sim.DT;
  for (const v of visuals) { v.group.position.lerpVectors(v.pp, v.cp, a); v.group.quaternion.slerpQuaternions(v.pq, v.cq, a); }
  for (const b of ballPool) {
    if (!b.ball) continue;
    b.mesh.position.lerpVectors(b.pp, b.cp, a); b.mesh.quaternion.slerpQuaternions(b.pq, b.cq, a);
    // 古いボールは小さくなって消える
    const age = b.ball.age;
    if (age > 7) b.mesh.scale.setScalar(b.base * Math.max(0.01, 1 - (age - 7) / 0.5));
    if (age > 7.5 || b.cp.y < -3) removeBall(b);
  }
  // 顔
  voiceCool -= dt; crashCool -= dt;
  if (sim.state !== lastState) {
    if (sim.state === 'stand' && lastState === 'getup') { setFace('normal'); beep(880, 0.07, 0); beep(1320, 0.1, 0.09); }
    if (sim.state === 'getup') hum();
    lastState = sim.state;
  }
  if (faceMode === 'hit') { faceT -= dt; if (faceT <= 0) setFace('normal'); }
  if (faceMode === 'dizzy') { faceTimer += dt; faceSpin += dt * 5; if (faceTimer > 1 / 15) { faceTimer = 0; drawFace(); } if (sim.state === 'stand') setFace('normal'); }
  // カメラはロボットにゆっくりついていく
  const pt = sim.parts.pelvis.body.translation();
  const kf = 1 - Math.exp(-dt * 1.5);
  camT.x += (pt.x - camT.x) * kf; camT.z += (pt.z - camT.z) * kf;
  placeCamera();
  updateParticles(dt);
  if (aimT < 1) { aimT += dt / 0.4; aimRing.material.opacity = 0.8 * (1 - aimT); aimRing.scale.setScalar(1 + aimT * 1.5); }
  // 最初の合図は胸の位置に
  if (!$('hint').classList.contains('off')) {
    const tp = sim.parts.torso.body.translation(); hintPos.set(tp.x, tp.y + 0.05, tp.z).project(camera);
    $('hint').style.left = ((hintPos.x + 1) / 2 * innerWidth) + 'px'; $('hint').style.top = ((1 - hintPos.y) / 2 * innerHeight) + 'px';
  }
  updateCharge();
  renderer.render(scene, camera);
  if (snapAt && now >= snapAt) { snapAt = 0; snapShot(); }
  requestAnimationFrame(frame);
}
// ===== Xに投稿（倒れた瞬間の画面を画像にして付ける）=====
const SHARE_URL = 'https://keifurukawafunnych.com/games/robot-stand/', TAG = '#不倒翁机器人ゲーム';
let snapAt = 0, shareFile = null;
const snapCv = document.createElement('canvas'); snapCv.width = snapCv.height = 1080;
const rawCv = document.createElement('canvas'); rawCv.width = rawCv.height = 1080; // 文字なしの切り抜き
function snapShot() {
  // ロボットを中心に正方形で切り抜く（描画した直後なので canvas から読める）
  const src = renderer.domElement, W = src.width, H = src.height;
  const tp = sim.parts.pelvis.body.translation(), v = new THREE.Vector3(tp.x, tp.y + 0.2, tp.z).project(camera);
  const side = Math.min(W, H) * 0.92;
  let sx = (v.x + 1) / 2 * W - side / 2, sy = (1 - v.y) / 2 * H - side / 2;
  sx = Math.max(0, Math.min(W - side, sx)); sy = Math.max(0, Math.min(H - side, sy));
  const r = rawCv.getContext('2d'); r.fillStyle = '#23262d'; r.fillRect(0, 0, 1080, 1080);
  r.drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
  updateShare();
}
window.updateShare = function updateShare() {
  const text = `${t('title')}\n${TAG}`;
  const a = $('share');
  a.href = 'https://x.com/intent/post?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(SHARE_URL);
  if (matchMedia('(pointer: coarse)').matches) a.removeAttribute('target'); else { a.target = '_blank'; a.rel = 'noopener'; }
  a.dataset.text = text;
  // 画像: 切り抜き＋タイトル
  const x = snapCv.getContext('2d');
  x.drawImage(rawCv, 0, 0);
  const g = x.createLinearGradient(0, 860, 0, 1080); g.addColorStop(0, 'rgba(20,22,27,0)'); g.addColorStop(1, 'rgba(20,22,27,0.85)');
  x.fillStyle = g; x.fillRect(0, 860, 1080, 220);
  x.fillStyle = '#fff'; x.textBaseline = 'alphabetic';
  x.font = '800 120px system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif';
  x.font = '700 56px system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif'; x.globalAlpha = 0.85;
  x.fillText(t('title'), 64, 1030); x.globalAlpha = 1;
  // 共有用ファイルは先に作っておく（押した時に作ると Safari で共有が止まる）
  snapCv.toBlob(b => { if (b) shareFile = new File([b], 'robot-stand.png', { type: 'image/png' }); }, 'image/png');
};
$('share').addEventListener('click', e => {
  const text = $('share').dataset.text;
  if (matchMedia('(pointer: coarse)').matches) {
    // スマホ: 画像つきで共有シートを開く（使えなければそのまま X の投稿画面へ）
    if (navigator.share && shareFile && navigator.canShare?.({ files: [shareFile] })) {
      e.preventDefault();
      navigator.share({ files: [shareFile], text: `${text}\n${SHARE_URL}` }).catch(() => {});
    }
  } else if (shareFile) {
    // PC: 画像を保存してから投稿画面を開く（画像は自分で添付する）
    const u = URL.createObjectURL(shareFile), d = document.createElement('a');
    d.href = u; d.download = 'robot-stand.png'; document.body.appendChild(d); d.click(); d.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
  }
});

renderer.compile(scene, camera);
renderer.render(scene, camera);
snapShot(); // 倒す前でも投稿できるよう、立っている姿を用意しておく
// 広告は、開いて少したってから読み込む（最初の表示を重くしないため）
setTimeout(() => window.resultAd?.(true), 1500);
requestAnimationFrame(t0 => { last = t0; frame(t0); });
</script>

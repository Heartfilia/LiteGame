      // 上に残り時間と枚数を出すので、棚の上を少し空ける（背の低い横長画面では左上に出すので不要）。結果画面では手前の床を広く見せて、そこに枚数を出す

      const topM = lowWide ? 0.03 : 0.34, front = state === 'result' ? WALL_Z + 1.5 : WALL_Z + 0.5;
      KEY = [[left, top + topM, WALL_Z + 0.05], [right, top + topM, WALL_Z + 0.05], [left, 0, WALL_Z + 0.35], [right, 0, WALL_Z + 0.35], [left * 0.8, 0, front], [right * 0.8, 0, front]].map(a => new THREE.Vector3(...a));
      LOOK.set((left + right) / 2, top * 0.48, WALL_Z + 0.2);
      fitCamera();
    }
    const _p = new THREE.Vector3();
    function placeCam(d) {
      camera.position.copy(LOOK).addScaledVector(VIEW_DIR, d);
      camera.lookAt(LOOK); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
      let x0 = 9, x1 = -9, y0 = 9, y1 = -9;
      for (const k of KEY) { _p.copy(k).project(camera); if (_p.z > 1 || _p.z < -1) return null; x0 = Math.min(x0, _p.x); x1 = Math.max(x1, _p.x); y0 = Math.min(y0, _p.y); y1 = Math.max(y1, _p.y); }
      return { x0, x1, y0, y1 };
    }
    function fitCamera() {
      const { w, h, H } = layout;
      camera.aspect = w / h; camera.clearViewOffset();
      let lo = 0.8, hi = 40;
      for (let i = 0; i < 26; i++) { const mid = (lo + hi) / 2, b = placeCam(mid); if (b && (b.x1 - b.x0) / 2 <= 0.94 && (b.y1 - b.y0) / 2 <= 0.92) hi = mid; else lo = mid; }
      const b = placeCam(hi);
      camera.setViewOffset(w, h, Math.round((b.x0 + b.x1) / 2 * w / 2), Math.round(-(b.y0 + b.y1) / 2 * h / 2), w, H);
      camera.updateProjectionMatrix();
      // 結果の枚数は、棚の手前の床の上に出す
      _p.set(0, 0, WALL_Z + 1.0).project(camera);
      resultEl.style.top = Math.round(clamp((1 - _p.y) / 2 * H, 80, h - 50)) + 'px';
    }

    // ---------- 結果 ----------
    function renderControls() {
      controls.innerHTML = '';
      controls.classList.toggle('hide', state !== 'result');
      if (state !== 'result') return;
      const b = document.createElement('button');
      b.className = 'go'; b.textContent = t('again');
      b.addEventListener('click', reset);
      controls.append(b);
      const a = document.createElement('a');
      a.className = 'post'; a.textContent = t('post');
      a.href = `https://x.com/intent/post?text=${encodeURIComponent(t('share')(score))}&url=${encodeURIComponent(SHARE_URL)}`;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (!coarse) { a.target = '_blank'; a.rel = 'noopener'; }
      // スマホは画像ごと共有シートへ。PCは画像を保存してから投稿画面を開く
      a.addEventListener('click', e => {
        const text = t('share')(score);
        if (coarse && navigator.share) {
          e.preventDefault();
          const file = shareFile();
          const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], text: `${text}\n${SHARE_URL}` } : { text: `${text}\n${SHARE_URL}` };
          navigator.share(data).catch(() => {});
          return;
        }
        const img = resultImage();
        if (img) { const d = document.createElement('a'); d.href = img.toDataURL('image/png'); d.download = 'plate-smash.png'; d.click(); }
      });
      controls.append(a);
    }
    // 結果画像: かけらだらけの棚に枚数を重ねる
    let snap = null, shareCache = null, needSnap = false;
    function takeSnap() {
      const src = renderer.domElement;
      const f = _v.set((rack.left + rack.right) / 2, rack.top * 0.45, WALL_Z + 0.3).project(camera);
      const fx = (f.x + 1) / 2 * src.width, fy = (1 - f.y) / 2 * src.height;
      const side = Math.min(src.width, src.height);
      const sx = clamp(fx - side / 2, 0, src.width - side), sy = clamp(fy - side / 2, 0, src.height - side);
      snap = document.createElement('canvas'); snap.width = snap.height = 1080;
      snap.getContext('2d').drawImage(src, sx, sy, side, side, 0, 0, 1080, 1080);
      shareCache = null;
    }
    function resultImage() {
      if (!snap) return null;
      const c = document.createElement('canvas'); c.width = c.height = 1080;
      const g = c.getContext('2d');
      g.drawImage(snap, 0, 0);
      let gr = g.createLinearGradient(0, 0, 0, 260); gr.addColorStop(0, 'rgba(0,0,0,.3)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 1080, 260);
      gr = g.createLinearGradient(0, 700, 0, 1080); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.45)'); g.fillStyle = gr; g.fillRect(0, 700, 1080, 380);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.lineJoin = 'round';
      const font = px => `900 ${px}px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Noto Sans Thai", sans-serif`;
      const text = (str, y, px, max) => {
        g.font = font(px);
        const w = g.measureText(str).width; if (w > max) { px *= max / w; g.font = font(px); }
        g.lineWidth = px * .16; g.strokeStyle = '#1f4a78'; g.strokeText(str, 540, y); g.fillText(str, 540, y);
      };
      text(t('count')(score), 980, 190, 960);
      text(t('title'), 100, 60, 900);
      return c;
    }
    function prepareShare() {
      if (!snap) return;
      const key = lang;
      if (shareCache?.key === key) return;
      shareCache = { key, file: null };
      resultImage().toBlob(b => { if (b && shareCache?.key === key) shareCache.file = new File([b], 'plate-smash.png', { type: 'image/png' }); }, 'image/png');
    }
    const shareFile = () => shareCache?.key === lang ? shareCache.file : null;
    function showResult() {
      resultEl.children[0].textContent = t('count')(score);
      resultEl.children[1].textContent = t('best')(bestScore);
    }
    function finish() {
      state = 'result';
      if (score > bestScore) { bestScore = score; store.set('best', bestScore); }
      hudEl.style.display = 'none';
      showResult();
      resultEl.style.display = 'flex';
      renderControls(); resize();
      snap = null; needSnap = true;
    }

    // ---------- ループ ----------
    let last = performance.now(), acc = 0, lastHint = '', timeScale = 1, lastFill = '';
    function render(dt) {
      // 残り時間のゲージ（値が変わった時だけ書く。残り3秒からゆっくり赤くする。点滅はさせない）
      if (state === 'play' || state === 'end') {
        const fr = (timeLeft / TIME).toFixed(3);
        if (fr !== lastFill) {
          fillEl.style.transform = `scaleX(${fr})`; lastFill = fr;
          const red = clamp((3 - timeLeft) / 3, 0, 1);
          fillEl.style.background = `rgb(255,${Math.round(211 - 140 * red)},${Math.round(74 - 30 * red)})`;
        }
      }
      for (let i = pieces.length - 1; i >= 0; i--) {
        const b = pieces[i];
        if (b.dead) { scene.remove(b.mesh); b.mesh.geometry.dispose(); pieces.splice(i, 1); continue; }
        if (!b.rest || b.age < 99) { b.mesh.position.copy(b.p); b.mesh.quaternion.copy(b.q); if (b.rest) b.age = 99; }
      }
      if (chipDirty) {
        chipDirty = false;
        for (const s of chipSlots) chipMesh.setMatrixAt(s.i, s.alive && !s.dead ? _m.compose(s.p, s.q, _s.setScalar(s.sc)) : ZERO);
        chipMesh.instanceMatrix.needsUpdate = true;
      }
      updateDust(dt);
      for (const b of balls) if (b.alive) { b.mesh.position.copy(b.p); b.mesh.quaternion.copy(b.q); b.mesh.scale.setScalar(b.fade); }
      // 猫の額のゆれ
      catPivot.rotation.z = catSwing * Math.exp(-catSwingT * 2.2) * Math.sin(catSwingT * 8);
      // 最初の操作の案内（真ん中あたりのお皿をつつく指）
      let hint = 'none';
      if (state === 'ready' && rackSlots.length) {
        const s = rackSlots[Math.floor(rack.rows / 2) * rack.cols + Math.floor(rack.cols / 2)];
        _v.set(s.x + 0.04, s.y - 0.03, s.z + 0.05).project(camera);
        hintEl.style.left = Math.round((_v.x + 1) / 2 * layout.w) + 'px'; hintEl.style.top = Math.round((1 - _v.y) / 2 * layout.H) + 'px'; hint = 'block';
      }
      if (hint !== lastHint) { hintEl.style.display = hint; lastHint = hint; }
      renderer.render(scene, camera);
      if (needSnap) { needSnap = false; takeSnap(); prepareShare(); }
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000) * timeScale; last = now;
      acc += dt;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render(dt);
      requestAnimationFrame(loop);
    }

    addEventListener('resize', resize);
    resize();
    if (window.__KF_ZH__) lang = 'zh';
    applyLang();
    // テスト用の入口: 段・列を指定して、お皿の上の点（px, pz）を叩く
    window.__game = { get state() { return state; }, get score() { return score; }, get pieces() { return pieces.length; }, tap: (i, px, pz) => { const s = rackSlots[i]; if (s && s.alive) { const w = new THREE.Vector3(px, 0.02, pz).applyQuaternion(PLATE_UP_Q).add(_v2.set(s.x, s.y, s.z)); const o = camera.position.clone(); throwBall(new THREE.Ray(o, w.sub(o).normalize()), 0); } }, get n() { return rackSlots.length; }, set timeScale(v) { timeScale = v; }, set timeLeft(v) { timeLeft = v; } };
    // 最初の1回が重くならないように、全部の形を一度描いておく（かけら用の材質も先に用意）
    {
      for (const d of dusts) d.sp.visible = true;
      const tmp = TINTS.map(c => { const m = new THREE.Mesh(plateGeo, tintMat(c)); m.position.set(0, -5, 0); scene.add(m); return m; });
      renderer.compile(scene, camera); render(0.016);
      for (const m of tmp) scene.remove(m);
      for (const d of dusts) d.sp.visible = false;
    }
    requestAnimationFrame(t0 => { last = t0; loop(t0); });
  </script>

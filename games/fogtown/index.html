  function fresh(seed) {
    return {version:VERSION,seed:(seed>>>0)||1234567,map:'town',x:11,y:9,dir:'up',level:1,xp:0,hp:72,mp:18,gold:25,

  }
  function stats(s) {
    var v={maxHp:72+(s.level-1)*12,maxMp:18+(s.level-1)*3,atk:10+(s.level-1)*2,def:3+(s.level-1),magic:0,drain:0,reflect:0,discount:0};
    if(s.path==='blade'){v.atk+=3;v.maxHp+=12;}if(s.path==='spark'){v.magic+=5;v.maxMp+=6;}
    Object.keys(s.equip).forEach(function(slot){var it=ITEMS[s.equip[slot]];if(it)Object.keys(v).forEach(function(k){v[k]+=it[k]||0;});});return v;
  }
  function log(s,t){s.log.push(t);if(s.log.length>8)s.log.shift();return t;}
  function random(s){s.seed=(Math.imul(s.seed,1664525)+1013904223)>>>0;return s.seed/4294967296;}
  function threshold(s){return 20+s.level*14;}
  function xp(s,n){s.xp+=n;while(s.level<12&&s.xp>=threshold(s)){s.xp-=threshold(s);s.level++;var v=stats(s);s.hp=v.maxHp;s.mp=v.maxMp;log(s,'升到 '+s.level+' 级！生命与魔力完全恢复。');}if(s.level===12)s.xp=Math.min(s.xp,threshold(s)-1);}
  function active(s,e){if(e.type==='enemy')return !s.defeated.includes(e.id);if(e.type==='chest')return !s.opened.includes(e.id);if(e.type==='herb')return !s.herbs.includes(e.id);return true;}
  function at(s,x,y){return MAPS[s.map].entities.find(function(e){return e.x===x&&e.y===y&&active(s,e);});}
  function walkable(map,x,y){return Number.isInteger(x)&&Number.isInteger(y)&&x>=0&&x<W&&y>=0&&y<H&&MAPS[map].tiles[y][x]!=='#';}
  function objective(s){if(s.flags.completed)return '灯火已重燃 · 继续探索、收集遗物';if(!s.flags.intro)return '与北边的守灯人阿禾交谈';if(!s.keys.includes('forest'))return '萤火森林 · 击败盘根守卫，取回林之印';if(!s.keys.includes('mine'))return '回响矿洞 · 击败矿心巨像，取回岩之印';if(!s.keys.includes('ruins'))return '无光遗迹 · 击败无光守门人，取回星之印';return '返回雾灯镇 · 在北侧灯塔点燃三枚钥印';}
  function begin(s,e){var enemy=ENEMIES[e.kind];s.battle={id:e.id,hp:enemy.hp,turn:0};log(s,enemy.name+' 拦住了去路！');return {type:'battle'};}
  function interact(s,e){
    if(s.battle||!e||!active(s,e)||!MAPS[s.map].entities.includes(e)||Math.abs(e.x-s.x)+Math.abs(e.y-s.y)>1)return null;
    if(e.type==='enemy')return begin(s,e);
    if(e.type==='portal'){
      if(!s.flags.intro){log(s,'先和阿禾谈谈，了解镇外的迷雾。');return null;}
      if(e.require&&!s.keys.includes(e.require)){log(s,e.require==='forest'?'矿洞被根须封住了，需要林之印。':'遗迹入口被岩封住了，需要岩之印。');return null;}
      s.map=e.to;s.x=e.tx;s.y=e.ty;s.dir='right';if(!s.visited.includes(s.map))s.visited.push(s.map);log(s,'抵达'+MAPS[s.map].name+'。');return {type:'travel'};
    }
    if(e.type==='chest'){s.opened.push(e.id);var l=e.loot;s.gold+=l.gold||0;s.bag.potion+=l.potion||0;s.bag.ether+=l.ether||0;if(l.gear&&!s.owned.includes(l.gear))s.owned.push(l.gear);log(s,'打开'+e.name+'：'+(l.gear?ITEMS[l.gear].name+'、':'')+(l.gold||0)+' 金币，另有补给。');return {type:'loot'};}
    if(e.type==='herb'){s.herbs.push(e.id);log(s,'采到月露草（'+s.herbs.length+'/3）。药师芽芽也许需要它。');return {type:'loot'};}
    if(e.type==='camp'){var v=stats(s);s.hp=v.maxHp;s.mp=v.maxMp;log(s,'在'+e.name+'休息，生命与魔力恢复。');return {type:'rest'};}
    if(e.type==='sign'){log(s,e.text);return {type:'dialog',title:e.name,text:e.text};}
    if(e.type==='tower'){
      if(s.keys.length<3)return {type:'dialog',title:'熄灭的灯塔',text:'灯座上留着三个凹槽。森林、矿洞、遗迹的钥印，缺一不可。'};
      if(s.flags.completed)return {type:'dialog',title:'归来的灯火',text:'温暖的光穿过薄雾。镇上的每一扇窗，都亮了起来。你仍可继续探索。'};
      s.flags.completed=true;log(s,'三枚钥印汇成晨光，雾灯镇的灯塔重新亮起。');return {type:'ending'};
    }
    if(e.role==='elder'){if(!s.flags.intro){s.flags.intro=true;log(s,'接受委托：寻找三枚钥印。');return {type:'dialog',title:e.name,text:'我是阿禾，最后一位守灯人。森林的根、矿洞的心、遗迹的星，藏着三枚钥印。带它们回来，我们就能重新点亮灯塔。东边的森林最适合你的第一场冒险。'};}return {type:'dialog',title:e.name,text:objective(s)+'。记住：在泉眼休息不花金币，防御能恢复魔力。'};}

    }

      return {type:'dialog',title:e.name,text:'终于有人来了！这枚回响吊坠送给你，能减少技能的魔力消耗。我会沿着你清出的路回镇。'};
    }
    return {type:e.role,title:e.name};

  function move(s,dir){if(s.battle||!DIR[dir])return null;s.dir=dir;var d=DIR[dir],x=s.x+d[0],y=s.y+d[1];if(!walkable(s.map,x,y))return null;var e=at(s,x,y);if(e)return interact(s,e);s.x=x;s.y=y;s.steps++;return {type:'move'};}
  function nearby(s){var d=DIR[s.dir],front=at(s,s.x+d[0],s.y+d[1]);return front||MAPS[s.map].entities.find(function(e){return active(s,e)&&Math.abs(e.x-s.x)+Math.abs(e.y-s.y)===1;})||null;}
  function use(s,id){if(!['potion','ether'].includes(id)||s.bag[id]<1)return false;var v=stats(s),k=id==='potion'?'hp':'mp',max=id==='potion'?v.maxHp:v.maxMp;if(s[k]>=max)return false;s.bag[id]--;s[k]=Math.min(max,s[k]+(id==='potion'?45:12));log(s,'使用'+ITEMS[id].name+'。');return true;}
  function equip(s,id){var it=ITEMS[id];if(s.battle||!it||!it.slot||!s.owned.includes(id))return false;s.equip[it.slot]=id;var v=stats(s);s.hp=Math.min(s.hp,v.maxHp);s.mp=Math.min(s.mp,v.maxMp);log(s,'装备了'+it.name+'。');return true;}
  function choose(s,path){if(s.battle||s.path!=='wanderer'||!['blade','spark'].includes(path))return false;s.path=path;var v=stats(s);s.hp=v.maxHp;s.mp=v.maxMp;log(s,path==='blade'?'选择剑卫之路：攻击 +3，生命 +12。':'选择星火之路：火花 +5，魔力 +6。');return true;}
  function buy(s,id){var it=ITEMS[id];if(s.battle||s.map!=='town'||!it||it.price<=0||s.gold<it.price||(it.slot&&s.owned.includes(id)))return false;s.gold-=it.price;if(it.slot)s.owned.push(id);else s.bag[id]++;log(s,'购买了'+it.name+'。');return true;}
  function rest(s,train){if(s.battle||s.map!=='town')return false;var v=stats(s);s.hp=v.maxHp;s.mp=v.maxMp;if(train)s.defeated=s.defeated.filter(function(id){return ENEMIES[ALL[id].kind].boss;});log(s,train?'远征重新出发：普通怪物已刷新，宝箱与首领进度保留。':'旅店免费提供热汤。生命与魔力恢复。');return true;}
  function recall(s){if(s.battle)return false;s.map='town';s.x=11;s.y=9;s.dir='up';log(s,'沿着灯铃的声音回到小镇。');return true;}

  function victory(s){var b=s.battle,e=ENEMIES[ALL[b.id].kind];if(!s.defeated.includes(b.id))s.defeated.push(b.id);s.battle=null;s.kills++;s.gold+=e.gold;log(s,'击败'+e.name+'：'+e.xp+' 经验、'+e.gold+' 金币。');if(e.key&&!s.keys.includes(e.key)){s.keys.push(e.key);s.bag.potion+=2;log(s,'获得'+({forest:'林',mine:'岩',ruins:'星'}[e.key])+'之印与 2 瓶疗伤药！');}if(!e.boss&&random(s)<0.3){s.bag.potion++;log(s,'发现了一瓶疗伤药。');}xp(s,e.xp);return {type:'victory',boss:!!e.boss};}
  function battle(s,action){
    if(!s.battle||!['attack','power','spark','defend','potion','ether','flee'].includes(action))return null;

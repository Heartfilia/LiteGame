<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>宝石三消 · LiteGame</title><link rel="icon" href="../../assets/images/covers/match3.svg"><link rel="stylesheet" href="../lib/port.css"><link rel="stylesheet" href="../lib/casual.css"></head><body><main class="casual-page"><header><a href="../../index.html#casual">← 游戏厅</a><h1>宝石三消</h1></header><div class="port-toolbar"><button id="port-start">开始 / 继续</button><button id="port-pause">暂停</button><button id="port-save">存档</button><button id="port-reset">重新开始</button></div><p id="casual-loading" role="status">正在加载… <a href="">重新载入</a></p><div id="casual-stats" class="casual-stats"></div><div class="casual-stage"><div id="casual-board" class="casual-board" role="group" aria-label="八乘八宝石棋盘"></div></div><div class="casual-actions"><button id="hint">提示一步</button><button id="casual-next" hidden>下一关</button><button id="casual-retry" hidden>重试本关</button></div><div id="casual-message" class="casual-message" role="status"></div><p id="casual-pause" class="port-note"></p><div id="port-status" role="status"></div><details><summary>玩法说明</summary><p class="casual-help">先点一颗宝石，再点相邻宝石交换。横排或竖排三个以上相同宝石会消除，掉落后继续连消；无效交换不扣步数。每关同时达到目标分数和指定宝石收集量即可过关，共 20 关。<br>没有倒计时，可以慢慢思考。提示不扣分，棋盘没有合法交换时自动重排；用完步数可重试当前关。不同形状帮助识别宝石，键盘 Tab 选格、回车选择。每步自动保存。</p></details><footer class="casual-credit">基于 Rembound.com 的 Match-3 Game HTML5（MIT）进行规则移植和关卡扩展。<a href="SOURCE.md">源码与修改说明</a> · <a href="LICENSE">许可证</a></footer></main><script src="../lib/casual-loader.js" data-port="match3"></script></body></html>

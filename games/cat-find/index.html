<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d0b" />
  <meta name="description" content="猫猫找不同：一堆花色相近的猫里，抢先把和题目一样的那只揪出来。" />
  <title>猫猫找不同 · LiteGame</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/css/room-client.css" />
  <link rel="stylesheet" href="../premium/theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-game="cat-find">
  <div class="px-stage">
    <header class="px-top">
      <a class="px-back" href="../../index.html#/category/premium">← 大厅</a>
      <div class="px-name">猫猫找不同</div>
      <div class="px-tools">
        <span class="px-netbadge" id="netBadge" hidden><i></i>联机中</span>
        <button id="btnRoom" type="button">双人</button>
        <button id="btnSound" type="button" class="is-on" aria-pressed="true" aria-label="音效开关">音</button>
      </div>
    </header>

    <main class="ch-gamemain">
      <section class="px-screen px-start" id="screen-start">
        <div class="px-seal" aria-hidden="true">猫</div>
        <h1 class="px-title">猫猫找不同</h1>
        <p class="px-sub">二十只猫，只有一只和题目一模一样</p>
        <div class="px-modes">
          <button id="startSingle" type="button">单人挑战</button>
          <button id="startNet" type="button" class="is-ghost">和好友联机（2 人）</button>
        </div>
        <p class="px-rules">
          上方是要找的那只猫。<br />
          在一堆花色相近的猫里点中它，<b>先点到的人得分</b>，牌面立刻换新。<br />
          点错冻结半秒。60 秒，谁揪得多谁赢。
        </p>
      </section>

      <section class="px-screen" id="screen-game" hidden>
        <div class="cf-wrap">
          <div class="px-hud">
            <div class="px-side is-me">
              <span class="px-who" id="youName">你</span>
              <span class="px-pts" id="youScore">0</span>
            </div>
            <div class="px-clock" id="clock">60s</div>
            <div class="px-side is-right">
              <span class="px-who" id="rivalName">电脑</span>
              <span class="px-pts" id="rivalScore">0</span>
            </div>
          </div>
          <div class="px-timer" id="timer"><i id="timerFill"></i></div>

          <div class="cf-target">
            <div class="cf-face" id="targetFace" aria-hidden="true"></div>
            <div class="cf-text">找出同一只<b>同一只猫</b></div>
          </div>

          <div class="cf-board" id="board" role="group" aria-label="猫猫牌桌"></div>

          <div class="cf-foot">
            <span id="hint">点中题目里的那只猫</span>
            <span class="cf-flash" id="flash"></span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../../assets/js/mobile-ui.js"></script>
  <script src="../../assets/js/server-sync.js"></script>
  <script src="../../assets/js/room-client.js"></script>
  <script src="../premium/util.js"></script>
  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>

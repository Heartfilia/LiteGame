<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d0b" />
  <meta name="description" content="饺子：三笼蒸饺，轮流吃 1–2 只，吃到最后一只的人赢。" />
  <title>饺子 · LiteGame</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../assets/css/room-client.css" />
  <link rel="stylesheet" href="../premium/theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-game="gyoza">
  <div class="px-stage">
    <header class="px-top">
      <a class="px-back" href="../../index.html#/category/premium">← 大厅</a>
      <div class="px-name">饺子</div>
      <div class="px-tools">
        <span class="px-netbadge" id="netBadge" hidden><i></i>联机中</span>
        <button id="btnRoom" type="button">双人</button>
        <button id="btnSound" type="button" class="is-on" aria-pressed="true" aria-label="音效开关">音</button>
      </div>
    </header>

    <main class="ch-gamemain">
      <section class="px-screen px-start" id="screen-start">
        <div class="px-seal" aria-hidden="true">饺</div>
        <h1 class="px-title">饺子</h1>
        <p class="px-sub">三笼蒸饺，吃到最后一只的人赢</p>
        <div class="px-modes">
          <button id="startSingle" type="button">单人挑战</button>
          <button id="startNet" type="button" class="is-ghost">和好友联机（2 人）</button>
        </div>
        <p class="px-rules">
          三笼分别有 <b>7、5、3</b> 只饺子。<br />
          每回合挑一笼，<b>吃掉 1 或 2 只</b>，吃到最后一只的人获胜。<br />
          每回合限时 20 秒，想清楚再下筷。
        </p>
      </section>

      <section class="px-screen" id="screen-game" hidden>
        <div class="gy-wrap">
          <div class="px-hud">
            <div class="px-side is-me">
              <span class="px-who" id="youName">剩余饺子</span>
              <span class="px-pts" id="youScore">0</span>
            </div>
            <div class="px-clock" id="clock">20s</div>
            <div class="px-side is-right">
              <span class="px-who" id="rivalName">对手 · 电脑</span>
              <span class="px-pts" id="rivalScore">0</span>
            </div>
          </div>
          <div class="px-timer" id="timer"><i id="timerFill"></i></div>

          <div class="gy-turn" id="turnLine">你先下筷</div>
          <div class="gy-table" id="table"></div>

          <div class="gy-actions" id="actions" hidden>
            <button id="eat1" type="button">吃 1 只</button>
            <button id="eat2" type="button">吃 2 只</button>
            <button id="cancel" type="button" class="is-ghost">换一笼</button>
          </div>

          <div class="gy-last">
            <span id="hint">挑一笼</span>
            <span class="gy-flash" id="flash"></span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../../assets/js/mobile-ui.js"></script>
  <script src="../../assets/js/server-sync.js"></script>
  <script src="../../assets/js/room-client.js"></script>
  <script src="../premium/util.js"></script>
  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
